<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex Play · Menú</title>
<meta name="theme-color" content="#0b1626">
<script type="module" src="https://unpkg.com/@google/model-viewer@4/dist/model-viewer.min.js"></script>
<script src="/web/apex-voz.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root { --bg:#0b1626; --bg2:#0e1d33; --card:rgba(255,255,255,.04); --line:rgba(139,233,255,.14); --txt:#eef3fa; --muted:#93a4bb;
        --c1:#0b3d91; --c2:#3fd0ff; --c3:#8be9ff; --oro:#f5c26b; --ok:#43d39e; --bad:#ff7a7a;
        --titulo:"Italiana", Georgia, serif; --cuerpo:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
* { box-sizing:border-box; margin:0; }
html { background:var(--bg); }
body { color:var(--txt); font:16px/1.5 var(--cuerpo); padding-bottom:170px; min-height:100vh;
       background:radial-gradient(120% 60% at 50% -10%, #12345e 0%, var(--bg) 60%) fixed, var(--bg); }
header { padding:26px 16px 4px; text-align:center; position:relative; }
.mesa-chip { display:inline-block; font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--c3);
             border:1px solid var(--line); border-radius:999px; padding:5px 12px; }
header h1 { font:400 34px/1.1 var(--titulo); letter-spacing:.01em; margin-top:12px; text-wrap:balance; }
.orbe { width:170px; height:170px; margin:0 auto -14px; position:relative; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.orbe canvas { width:100%; height:100%; }
.estado { display:flex; justify-content:center; align-items:center; gap:8px; color:var(--c3); font-size:14px; min-height:22px; }
.estado:not(:empty)::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--c2); box-shadow:0 0 10px var(--c2); }
.sugerencias { display:flex; gap:8px; overflow-x:auto; padding:10px 16px 2px; max-width:720px; margin:auto; scrollbar-width:none; }
.sugerencias span { flex:none; font-size:13px; color:var(--muted); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:7px 13px; }
.seccion { max-width:720px; margin:22px auto 0; padding:0 16px; font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--c2); font-weight:600; }
.platos { display:grid; gap:16px; padding:12px 16px 16px; max-width:720px; margin:auto; }
@media (min-width:680px) { .platos { grid-template-columns:1fr 1fr; } }
.plato { background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.02)); border:1px solid var(--line); border-radius:22px; overflow:hidden;
         box-shadow:0 18px 40px -24px rgba(0,0,0,.8); }
.plato model-viewer { width:100%; height:230px; background:radial-gradient(circle at 50% 45%, #1a3554, #0b1626 70%); --poster-color:transparent; }
.plato .sin3d { height:130px; display:grid; place-items:center; background:radial-gradient(circle at 50% 45%, #1a3554, #0b1626 70%); font-size:44px; }
.plato .info { padding:16px 18px 18px; }
.plato h2 { font:600 18px/1.3 var(--cuerpo); display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
.plato h2 span { color:var(--oro); white-space:nowrap; font-size:16px; font-variant-numeric:tabular-nums; }
.plato p { color:var(--muted); font-size:14px; margin-top:6px; }
.acciones { display:flex; gap:10px; margin-top:14px; }
button { font:inherit; border:0; border-radius:999px; padding:11px 18px; cursor:pointer; transition:transform .12s, filter .12s; }
button:active { transform:scale(.97); }
.pedir { background:var(--c2); color:#04121c; font-weight:700; flex:1; }
.ar { background:transparent; color:var(--txt); border:1px solid var(--line); }
.ar::before { content:"◈ "; color:var(--c2); }
.cuenta { color:var(--ok); font-size:13px; margin-top:10px; min-height:18px; font-weight:500; }
.barra { position:fixed; left:0; right:0; bottom:0; padding:28px 16px calc(14px + env(safe-area-inset-bottom, 0px));
         background:linear-gradient(transparent, rgba(11,22,38,.92) 30%, var(--bg)); }
.todo { width:100%; max-width:720px; display:block; margin:auto; background:linear-gradient(90deg, #1565c0, var(--c2)); color:#fff; font-weight:700; padding:16px; font-size:16px;
        box-shadow:0 10px 30px -10px rgba(63,208,255,.6); }
.todo:disabled { opacity:.35; box-shadow:none; }
.mesero { display:block; margin:10px auto 0; background:transparent; color:var(--muted); border:1px solid var(--line); font-size:14px; padding:9px 18px; }
.mesero.alerta { background:var(--oro); color:#1b1203; border:0; font-weight:700; font-size:16px; padding:13px 24px; box-shadow:0 0 0 6px rgba(245,194,107,.18); }
.inicio { position:fixed; inset:0; background:radial-gradient(90% 60% at 50% 35%, #12345e, #070f1c 75%); display:grid; place-items:center; text-align:center; z-index:10; padding:24px; }
.inicio .orbe { width:200px; height:200px; }
.inicio h1 { font:400 40px/1.1 var(--titulo); margin-top:6px; text-wrap:balance; }
.inicio button { background:var(--c2); color:#04121c; font-weight:700; font-size:18px; padding:16px 34px; margin-top:22px; box-shadow:0 10px 34px -8px rgba(63,208,255,.7); }
.inicio p { color:var(--muted); max-width:300px; margin:14px auto 0; font-size:14px; }
.aviso { position:fixed; left:16px; right:16px; top:calc(16px + env(safe-area-inset-top, 0px)); background:#2a1416; border:1px solid #5b2a2e; color:#ffd5d5; padding:12px 14px; border-radius:14px; z-index:20; font-size:14px; }
</style>
</head>
<body>
<div class="inicio" id="inicio">
  <div>
    <div class="orbe" style="pointer-events:none"><canvas id="orbe0" width="400" height="400"></canvas></div>
    <h1 id="titulo-inicio">Bienvenido</h1>
    <button id="comenzar">Toque para comenzar</button>
    <p>El orbe le atenderá por voz. Necesita permiso para usar el micrófono.</p>
  </div>
</div>
<header>
  <span class="mesa-chip" id="mesa">Mesa</span>
  <h1 id="nombre">Menú</h1>
  <div class="orbe" id="orbe" title="Toque el orbe para hablar"><canvas id="orbe1" width="340" height="340"></canvas></div>
  <div class="estado" id="estado"></div>
</header>
<div class="sugerencias" aria-label="Puede decir, por ejemplo">
  <span>«¿Qué me recomienda?»</span><span>«¿Qué lleva este plato?»</span><span>«Quiero dos de esos»</span><span>«Eso es todo»</span>
</div>
<div class="seccion">La carta</div>
<main class="platos" id="platos"></main>
<div class="barra">
  <button class="todo" id="todo" disabled>Pedir todo lo seleccionado</button>
  <button class="mesero" id="mesero">🙋 Llamar al mesero</button>
</div>

<script>
const q = new URLSearchParams(location.search), R = q.get("r") || "demo", MESA = q.get("mesa") || "1";
const API = q.get("api") || location.origin;
const $ = (s) => document.querySelector(s);
const ETIQ = { apagado: "Toque el orbe para hablar", conectando: "Conectando…", escuchando: "Le escucho",
               oyendo: "Le escucho…", pensando: "Un momento…", hablando: "", dormido: "Toque el orbe para seguir hablando" };
let menu = null, cuentas = {};

const orbe = new ApexVoz({ api: API, restaurante: R, mesa: MESA });
let nivel = 0, estado = "apagado";
orbe.onestado = (e) => { estado = e; $("#estado").textContent = ETIQ[e] ?? ""; };
orbe.onnivel = (n) => { nivel = n; };
orbe.onerror = (m) => { const a = document.createElement("div"); a.className = "aviso"; a.textContent = m;
  document.body.append(a); setTimeout(() => a.remove(), 6000); };
orbe.onpedido = (r) => {
  cuentas = {};
  if (!r.pedido_numero && r.platos) for (const p of r.platos) cuentas[p.plato] = (cuentas[p.plato] || 0) + p.cantidad;
  pintarCuentas();
};
orbe.onsinvoz = () => { $("#mesero").classList.add("alerta"); $("#mesero").hidden = false; };

function pintarCuentas() {
  let total = 0;
  for (const p of menu.menu) { const n = cuentas[p.nombre] || 0; total += n;
    $(`#c-${p.id}`).textContent = n ? `${n} en su pedido` : ""; }
  $("#todo").disabled = !total;
}

const plata = (v) => new Intl.NumberFormat("es-CO", { style: "currency", currency: menu.moneda, maximumFractionDigits: 0 }).format(v);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function cargar() {
  menu = await (await fetch(`${API}/v1/menu/${encodeURIComponent(R)}`)).json();
  document.title = `${menu.nombre} · Menú`;
  $("#nombre").textContent = menu.nombre; $("#titulo-inicio").textContent = menu.nombre; $("#mesa").textContent = `Mesa ${MESA}`;
  $("#platos").innerHTML = menu.menu.map((p) => `
    <article class="plato">
      ${p.modelo3d ? `<model-viewer id="mv-${esc(p.id)}" src="${esc(p.modelo3d)}" alt="${esc(p.nombre)}" ar ar-modes="webxr scene-viewer quick-look"
          camera-controls auto-rotate shadow-intensity="1" touch-action="pan-y"></model-viewer>` : `<div class="sin3d">🍽️</div>`}
      <div class="info">
        <h2>${esc(p.nombre)} <span>${plata(p.precio)}</span></h2>
        <p>${esc(p.descripcion)}</p>
        <div class="acciones">
          <button class="pedir" data-id="${esc(p.id)}">Pedir</button>
          ${p.modelo3d ? `<button class="ar" data-ar="${esc(p.id)}">Ver en su mesa</button>` : ""}
        </div>
        <div class="cuenta" id="c-${esc(p.id)}"></div>
      </div>
    </article>`).join("");
  document.querySelectorAll(".pedir").forEach((b) => b.onclick = () => orbe.pedirPlato(b.dataset.id).catch((e) => orbe.onerror(e.message)));
  document.querySelectorAll("[data-ar]").forEach((b) => b.onclick = () => $(`#mv-${b.dataset.ar}`).activateAR());
}

$("#comenzar").onclick = async () => { $("#inicio").remove(); await orbe.iniciar(); };
$("#orbe").onclick = () => { if (["apagado", "dormido"].includes(orbe.estado)) orbe.iniciar(); };
$("#mesero").onclick = () => orbe.llamarMesero().catch((e) => orbe.onerror(e.message));
$("#todo").onclick = () => orbe.pedirTodo().catch((e) => orbe.onerror(e.message));

/* Orbe: esfera azul hielo que respira en reposo y late con la voz real. */
function dibujar(cv, t) {
  const g = cv.getContext("2d"), w = cv.width, c = w / 2, r = w * 0.27;
  const habla = estado === "hablando" ? nivel : 0, oye = ["escuchando", "oyendo"].includes(estado) ? 0.06 + nivel * 0.15 : 0;
  const k = 1 + 0.035 * Math.sin(t * 1.8) + habla * 0.22 + oye * Math.sin(t * 6);
  g.clearRect(0, 0, w, w);
  const halo = g.createRadialGradient(c, c, r * 0.7 * k, c, c, r * 1.85 * k);
  halo.addColorStop(0, `rgba(63,208,255,${0.32 + habla * 0.45})`); halo.addColorStop(0.5, `rgba(63,208,255,${0.08 + habla * 0.15})`);
  halo.addColorStop(1, "rgba(63,208,255,0)");
  g.fillStyle = halo; g.fillRect(0, 0, w, w);
  const anillo = (inc, vel, alfa, grosor) => { g.save(); g.translate(c, c); g.rotate(inc + t * vel);
    g.strokeStyle = `rgba(139,233,255,${alfa})`; g.lineWidth = w * grosor;
    g.beginPath(); g.ellipse(0, 0, r * 1.32 * k, r * 0.3 * k, 0, 0, Math.PI * 2); g.stroke(); g.restore(); };
  const giro = estado === "pensando" ? 2.4 : 0.5;
  anillo(-0.35, giro * 0.6, 0.18, 0.006);
  const cuerpo = g.createRadialGradient(c - r * 0.35, c - r * 0.4, r * 0.05, c, c, r * k);
  cuerpo.addColorStop(0, "#f2fcff"); cuerpo.addColorStop(0.25, "#7fe2ff"); cuerpo.addColorStop(0.55, "#2a9fe0");
  cuerpo.addColorStop(0.85, "#0b3d91"); cuerpo.addColorStop(1, "#061a3d");
  g.beginPath(); g.arc(c, c, r * k, 0, Math.PI * 2); g.fillStyle = cuerpo; g.fill();
  const borde = g.createRadialGradient(c, c, r * 0.8 * k, c, c, r * k);
  borde.addColorStop(0, "rgba(139,233,255,0)"); borde.addColorStop(1, `rgba(139,233,255,${0.35 + habla * 0.4})`);
  g.fillStyle = borde; g.fill();
  anillo(0.25, giro, 0.6 + habla * 0.3, 0.01);
}
(function animar(now) { const t = now / 1000; for (const id of ["orbe0", "orbe1"]) { const cv = document.getElementById(id); if (cv) dibujar(cv, t); }
  requestAnimationFrame(animar); })(0);

addEventListener("pagehide", () => orbe.terminar("salió de la página"));
cargar().catch(() => orbe.onerror("No se pudo cargar el menú."));
</script>
</body>
</html>
