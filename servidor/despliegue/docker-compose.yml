# Axtra en el servidor: la app + el túnel seguro de Cloudflare (no se abre ningún puerto a internet).
# Lo usa instalar_servidor.sh; las claves van en ../.env
services:
  axtra:
    build:
      context: ../..
      dockerfile: servidor/Dockerfile
    env_file: ../.env              # TODAS las claves viven aquí: Axtra es la tarjeta madre
    environment:
      - APEX_DATOS=/apex_datos       # para la pantalla «Negocios»
    volumes:
      - axtra_datos:/datos
      - apex_datos:/apex_datos
    restart: unless-stopped
    expose:
      - "8080"                       # la app de Axtra (el túnel la publica en axtra.chat, con Access)
      - "8090"                       # la ranura privada de los orbes (el túnel NO la publica)

  # Puerta pública de los orbes de negocios (api.axtra.chat, SIN Cloudflare Access) y SIN claves:
  # el oído, el cerebro, la voz y los PIN se los pide a Axtra por la ranura privada.
  apex:
    build:
      context: ../..
      dockerfile: servidor/Dockerfile
    command: ["uvicorn", "servidor.apex.app:app", "--host", "0.0.0.0", "--port", "8081", "--proxy-headers"]
    environment:
      - APEX_DATOS=/apex_datos
      - RANURA_URL=http://axtra:8090
    volumes:
      - apex_datos:/apex_datos
    restart: unless-stopped
    expose:
      - "8081"
    depends_on:
      - axtra

  tunel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    env_file: ../.env            # usa TUNNEL_TOKEN
    restart: unless-stopped
    depends_on:
      - axtra

volumes:
  axtra_datos:
  apex_datos:
