<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Contenido Apex</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
:root {
  --fondo: #0a1120; --panel: #111a2b; --panel-2: #18243a; --linea: rgba(191,155,95,.24); --linea-suave: rgba(246,241,231,.08);
  --oro: #bf9b5f; --oro-claro: #dcc08c; --crema: #f6f1e7; --suave: #9aa6ba; --tenue: #6f7b90; --bien: #5fbf8f; --mal: #d9826f; --azul: #8fb3d9;
  --titulo: "Playfair Display", Georgia, serif; --cuerpo: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
body { background: var(--fondo); color: var(--crema); font-family: var(--cuerpo); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--oro-claro); }
:focus-visible { outline: 2px solid var(--oro-claro); outline-offset: 2px; border-radius: 6px; }
.envoltura { width: min(980px, 100%); margin-inline: auto; padding: max(18px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); display: grid; gap: 18px; }
.ceja { font-size: 11.5px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--oro); }
h1 { font-family: var(--titulo); font-style: italic; font-weight: 400; font-size: clamp(30px, 6vw, 44px); line-height: 1.1; }
h2 { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--suave); }
.cabeza { display: grid; gap: 6px; } .cabeza p { color: var(--suave); max-width: 62ch; }
.bloque { background: var(--panel); border: 1px solid var(--linea-suave); border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
.redes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.red { display: grid; gap: 6px; align-content: start; }
.red b { font-size: 16px; } .red p { font-size: 13px; color: var(--suave); }
.punto { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; background: var(--mal); }
.punto.si { background: var(--bien); }
.boton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px; border-radius: 999px;
  font-weight: 700; border: 1px solid var(--linea); background: transparent; cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--crema); }
.boton.oro { background: linear-gradient(135deg, var(--oro-claro), var(--oro)); color: #111a2b; border: 0; }
.boton.chico { min-height: 34px; padding: 5px 12px; font-size: 13px; font-weight: 600; }
.boton:disabled { opacity: .45; cursor: default; }
.barra { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.barra p { color: var(--suave); font-size: 13px; }
.dia { display: grid; gap: 10px; }
.dia h3 { font-size: 14px; font-weight: 700; color: var(--oro-claro); padding-top: 6px; }
.dia h3::first-letter { text-transform: uppercase; }
.pieza { background: var(--panel); border: 1px solid var(--linea-suave); border-radius: 16px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.pieza.aprobada { border-color: rgba(95,191,143,.45); } .pieza.publicada { opacity: .75; } .pieza.descartada { opacity: .45; }
.p-cab { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 12px; align-items: start; cursor: pointer; }
@media (max-width: 600px) { .p-cab .chips { grid-column: 1 / -1; justify-content: flex-start; } }
.hora { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--suave); padding-top: 2px; }
.p-cab h4 { font-size: 16px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.p-cab .gancho { font-size: 13.5px; color: var(--suave); }
.chip { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--linea-suave); color: var(--suave); white-space: nowrap; }
.chip.aprobada { color: var(--bien); border-color: rgba(95,191,143,.4); } .chip.publicada { color: var(--azul); border-color: rgba(143,179,217,.4); }
.chip.error { color: var(--mal); border-color: rgba(217,130,111,.4); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.detalle { display: grid; gap: 12px; border-top: 1px solid var(--linea-suave); padding-top: 12px; }
.cuerpo { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 16px; }
@media (max-width: 720px) { .cuerpo { grid-template-columns: 1fr; } .vista { order: -1; } }
.vista { display: grid; gap: 8px; align-content: start; justify-items: center; }
.vista video { width: 100%; max-width: 240px; aspect-ratio: 9 / 16; border-radius: 14px; background: #000; border: 1px solid var(--linea-suave); }
.vista .vacio { width: 100%; max-width: 240px; aspect-ratio: 9 / 16; border-radius: 14px; border: 1px dashed var(--linea); display: grid; place-items: center;
  text-align: center; color: var(--suave); font-size: 13px; padding: 16px; }
.escena { display: grid; gap: 6px; background: var(--panel-2); border-radius: 12px; padding: 10px; }
.escena .fila { display: flex; gap: 8px; flex-wrap: wrap; }
label, .etq { font-size: 12px; font-weight: 600; color: var(--suave); }
input[type=text], input[type=datetime-local], select, textarea { width: 100%; background: var(--fondo); border: 1px solid var(--linea-suave); border-radius: 10px; padding: 8px 10px; min-height: 38px; }
textarea { resize: vertical; min-height: 60px; }
.escena select { width: auto; flex: 1 1 140px; } .escena input { flex: 2 1 180px; width: auto; }
.campo { display: grid; gap: 4px; min-width: 0; }
.acciones { display: flex; gap: 8px; flex-wrap: wrap; }
.aviso { font-size: 13px; color: var(--mal); }
.ok { font-size: 13px; color: var(--bien); }
.pie { font-size: 12px; color: var(--tenue); max-width: 80ch; }
.pestanas { display: inline-flex; gap: 4px; padding: 4px; background: var(--panel); border: 1px solid var(--linea-suave); border-radius: 999px; justify-self: start; max-width: 100%; }
.pestanas button { min-height: 38px; padding: 6px 16px; border-radius: 999px; border: 0; background: transparent; color: var(--suave); font-weight: 700; cursor: pointer; }
.pestanas button[aria-selected="true"] { background: linear-gradient(135deg, var(--oro-claro), var(--oro)); color: #111a2b; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; font-weight: 500; color: var(--crema); cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--oro); width: 16px; height: 16px; flex: none; }
.opciones { display: flex; gap: 8px 18px; flex-wrap: wrap; }
.voz-form { display: grid; gap: 10px; justify-items: start; }
.voz-form .nombre { font-size: 13px; color: var(--suave); overflow-wrap: anywhere; }
details.guia { background: var(--panel-2); border-radius: 12px; padding: 10px; }
details.guia summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--suave); }
details.guia[open] summary { margin-bottom: 8px; }
details.guia .campo + .campo { margin-top: 8px; }
.chip.grabado { color: var(--oro-claro); border-color: var(--linea); }
</style>
</head>
<body>
<main class="envoltura">
  <header class="cabeza">
    <span class="ceja">Apex · Redes</span>
    <h1>Agente de contenido</h1>
    <p id="intro"></p>
  </header>

  <div class="pestanas" role="tablist" aria-label="De quién es el contenido">
    <button role="tab" id="tab-apex" data-pestana="apex" aria-selected="true">Apex</button>
    <button role="tab" id="tab-personal" data-pestana="personal" aria-selected="false">Mi marca personal</button>
  </div>

  <section class="bloque" aria-labelledby="t-redes">
    <h2 id="t-redes">Cuentas</h2>
    <div class="redes">
      <div class="red"><b><span class="punto" id="p-ig"></span>Instagram</b><p id="t-ig"></p></div>
      <div class="red"><b><span class="punto" id="p-tt"></span>TikTok</b><p id="t-tt"></p>
        <a class="boton chico" id="b-tt" href="/api/contenido/tiktok/conectar" hidden>Conectar TikTok</a></div>
    </div>
  </section>

  <section class="bloque" id="b-voz" aria-labelledby="t-voz" hidden>
    <h2 id="t-voz">Su voz clonada</h2>
    <p id="t-voz-estado"></p>
    <div class="voz-form" id="voz-form">
      <button class="boton chico" id="b-voz-elegir">Elegir audio o video</button>
      <input type="file" id="f-voz" accept="audio/*,video/*" hidden>
      <span class="nombre" id="n-voz"></span>
      <label class="check"><input type="checkbox" id="c-voz"> Confirmo que esta voz es mía y autorizo clonarla para mi contenido.</label>
      <button class="boton oro chico" id="b-voz-clonar" disabled>Clonar mi voz</button>
    </div>
    <button class="boton chico" id="b-voz-borrar" hidden>Borrar mi voz clonada</button>
    <p class="ok" id="m-voz" aria-live="polite"></p>
  </section>

  <div class="barra">
    <p id="resumen">Cargando…</p>
    <div class="acciones">
      <button class="boton oro" id="b-subir-nuevo" hidden>Subir un video mío</button>
      <input type="file" id="f-nuevo" accept="video/*" hidden>
      <button class="boton" id="b-proponer">Proponer 7 días más</button>
    </div>
  </div>
  <p class="ok" id="m-general" aria-live="polite"></p>
  <p class="aviso" id="error-general" hidden></p>
  <section id="calendario" aria-live="polite"></section>

  <p class="pie" id="pie"></p>
</main>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const VISUALES = { portada_es: "Portada del menú", carta_es: "Carta en español", pedido_es: "Haciendo un pedido", idiomas: "Cambio de idioma",
    carta_en: "Carta en inglés", orbe: "El orbe", texto: "Texto grande" };
  const ESTADO = { propuesta: "Por aprobar", aprobada: "Aprobada", publicada: "Publicada", error: "Con error", descartada: "Descartada" };
  const TEXTOS = {
    apex: { intro: "El agente escribe y arma los videos de TikTok e Instagram, dos al día. Usted los mira, los cambia si quiere y los aprueba: solo lo aprobado se publica, a su hora.",
      pie: "Los videos se arman con la voz de Apex, pantallas reales del demo y el orbe. En TikTok llegan como borrador a su bandeja: ábralos en la app, póngales el sonido del momento si quiere y publíquelos (TikTok no deja publicar en público a una aplicación hasta que pasa su revisión). En Instagram se publican solos a la hora programada. El agente no copia videos de otras cuentas.",
      proponer: "Proponer 7 días más" },
    personal: { intro: "Usted graba con el celular y sube el video aquí. El agente lo pone vertical, quita los silencios, le pone subtítulos con lo que dijo y el gancho arriba, y escribe el texto de la publicación. También le propone ideas para grabar. Solo lo aprobado se publica, a su hora.",
      pie: "Su marca personal se publica en sus propias cuentas, no en las de Apex. Los videos originales que sube son privados y se borran dos semanas después de publicados. Los videos hechos con su voz clonada llevan «Voz generada con IA» en el texto; en TikTok márquelos también como contenido hecho con IA al publicarlos.",
      proponer: "Ideas para grabar (7 días)" },
  };
  let piezas = [], estado = {}, abierta = null, sondeo = null, pestana = "apex";
  try { if (localStorage.getItem("contenido-pestana") === "personal") pestana = "personal"; } catch (e) {}

  async function api(ruta, opts = {}) {
    const r = await fetch(ruta, { credentials: "same-origin", headers: { "Content-Type": "application/json" }, ...opts });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.detail || `error ${r.status}`);
    return d;
  }

  // Los videos del celular pesan mucho: se mandan en partes de 8 MB (si una parte falla por la red, se reintenta).
  async function subirPorPartes(ruta, archivo, avance) {
    if (!archivo.size) throw new Error("el archivo está vacío");
    const TROZO = 8 * 1024 * 1024; let desde = 0, d = {};
    while (desde < archivo.size) {
      const parte = archivo.slice(desde, desde + TROZO);
      for (let intento = 1; ; intento++) {
        try {
          const sep = ruta.includes("?") ? "&" : "?";
          const r = await fetch(`${ruta}${sep}desde=${desde}&total=${archivo.size}&nombre=${encodeURIComponent(archivo.name || "video.mp4")}`,
            { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/octet-stream" }, body: parte });
          d = await r.json().catch(() => ({}));
          if (!r.ok) { const e = new Error(d.detail || `error ${r.status}`); e.final = r.status < 500; throw e; }
          break;
        } catch (e) {
          if (e.final || intento >= 3) throw e;
          await new Promise((ok) => setTimeout(ok, 1500 * intento));
        }
      }
      desde += parte.size; avance(Math.round((desde / archivo.size) * 100));
    }
    return d;
  }

  async function cargar() {
    let d;
    try { d = await api("/api/contenido"); } catch (e) { $("#resumen").textContent = "No se pudo cargar: " + e.message; return; }
    piezas = d.piezas; estado = d;
    pintarCabeza();
    pintar();
    const armando = piezas.some((p) => (p.error || "").startsWith("armando"));
    if (armando && !sondeo) sondeo = setInterval(cargar, 5000);
    if (!armando && sondeo) { clearInterval(sondeo); sondeo = null; }
  }

  function pintarCabeza() {
    const personal = pestana === "personal", d = estado;
    for (const b of document.querySelectorAll("[data-pestana]")) b.setAttribute("aria-selected", String(b.dataset.pestana === pestana));
    $("#intro").textContent = TEXTOS[pestana].intro; $("#pie").textContent = TEXTOS[pestana].pie;
    $("#b-proponer").textContent = TEXTOS[pestana].proponer;
    $("#b-subir-nuevo").hidden = !personal; $("#b-voz").hidden = !personal;
    if (!d.piezas) return;
    const ig = personal ? d.personal.instagram : d.instagram, tt = personal ? d.personal.tiktok : d.tiktok;
    $("#p-ig").classList.toggle("si", ig); $("#p-tt").classList.toggle("si", tt);
    $("#t-ig").textContent = ig ? (personal ? "Conectada: sus Reels aprobados se publican solos a su hora." : "Conectada: los Reels aprobados se publican solos a su hora.")
      : personal ? "Falta conectarla: su Instagram debe ser cuenta de creador o profesional, unida a una página de Facebook, y su token va en el servidor (IG_PERSONAL_USUARIO_ID e IG_PERSONAL_TOKEN)."
      : "Falta conectarla: se necesita la cuenta profesional de Instagram unida a una página de Facebook y su token en el servidor.";
    $("#t-tt").textContent = tt ? "Conectada: los videos llegan como borrador a su bandeja de TikTok."
      : d.tiktok_app ? (personal ? "Toque «Conectar TikTok» e inicie sesión con su cuenta personal (no la de Apex)." : "Toque «Conectar TikTok» e inicie sesión con la cuenta de Apex.")
      : "Falta crear la aplicación en TikTok for Developers y poner sus claves en el servidor.";
    $("#b-tt").hidden = tt || !d.tiktok_app; $("#b-tt").href = `/api/contenido/tiktok/conectar?cuenta=${pestana}`;
    $("#t-voz-estado").textContent = d.voz_felipe
      ? "Lista. Úsela en los videos que arma el agente (elija «Mi voz clonada» en la voz del video) para los días en que no pueda grabar."
      : d.elevenlabs ? "Suba de 1 a 3 minutos hablando normal, sin música ni ruido de fondo: una nota de voz o uno de sus videos sirve."
      : "Falta la clave de ElevenLabs en el servidor (ELEVENLABS_API_KEY). La clonación de voz necesita un plan pago de ElevenLabs (Starter o más).";
    $("#voz-form").hidden = d.voz_felipe || !d.elevenlabs; $("#b-voz-borrar").hidden = !d.voz_felipe;
    const mias = piezas.filter((p) => (p.cuenta || "apex") === pestana), n = (e) => mias.filter((p) => p.estado === e).length;
    const porGrabar = mias.filter((p) => p.tipo === "grabado" && !p.grabada && p.estado !== "descartada").length;
    $("#resumen").textContent = `${n("propuesta")} por aprobar · ${n("aprobada")} aprobados · ${n("publicada")} publicados` + (personal ? ` · ${porGrabar} por grabar` : "");
  }

  function pintar() {
    const dias = {};
    for (const p of piezas.filter((x) => (x.cuenta || "apex") === pestana)) (dias[p.hora_colombia.slice(0, 10)] ||= []).push(p);
    const fecha = (d) => new Date(d + "T12:00:00-05:00").toLocaleDateString("es-CO", { weekday: "long", day: "numeric", month: "long" });
    const vacio = pestana === "personal" ? "Todavía no hay videos de su marca personal. Suba uno suyo o pida ideas para grabar." : "Todavía no hay videos en el calendario.";
    $("#calendario").innerHTML = Object.entries(dias).map(([d, ps]) => `<div class="dia"><h3>${fecha(d)}</h3>${ps.map(tarjeta).join("")}</div>`).join("")
      || `<div class="bloque">${vacio}</div>`;
    if (abierta) { const t = $(`.pieza[data-id="${abierta}"]`); if (t) abrir(t, true); }
  }

  function tarjeta(p) {
    const tipo = p.tipo === "grabado" ? `<span class="chip grabado">${p.grabada ? "Grabado por usted" : "Por grabar"}</span>`
      : p.voz === "felipe" ? `<span class="chip grabado">Con su voz (IA)</span>` : "";
    const chips = [`<span class="chip ${p.estado}">${ESTADO[p.estado] || p.estado}</span>`, tipo, p.pilar ? `<span class="chip">${esc(p.pilar)}</span>` : "",
      p.ig_enlace ? `<a class="chip publicada" href="${esc(p.ig_enlace)}" target="_blank" rel="noopener">Ver en Instagram</a>` : ""].join("");
    const titulo = p.titulo || (p.tipo === "grabado" ? "Video suyo" : "Sin título");
    return `<article class="pieza ${p.estado}" data-id="${p.id}">
      <div class="p-cab" role="button" tabindex="0"><span class="hora">${p.hora_colombia.slice(11)}</span>
        <div><h4>${esc(titulo)}</h4><div class="gancho">${esc(p.gancho)}</div></div><div class="chips">${chips}</div></div>
      ${p.error && !p.error.startsWith("armando") ? `<p class="aviso">${esc(p.error)}</p>` : ""}
      <div class="detalle" hidden></div></article>`;
  }

  function vistaVideo(p, armando, vacio) {
    return p.video ? `<video controls playsinline preload="metadata" src="/api/contenido/${p.id}/video?v=${esc(p.video.slice(0, 8))}#t=1.5"></video>`
      : `<div class="vacio">${armando ? (p.tipo === "grabado" ? "Editando su video… tarda uno o dos minutos." : "Armando el video… tarda menos de un minuto.") : vacio}</div>`;
  }

  function camposComunes(p) {
    return `<div class="campo"><label>Texto de la publicación</label><textarea data-c="descripcion">${esc(p.descripcion)}</textarea></div>
          <div class="campo"><label>Hashtags</label><input type="text" data-c="hashtags" value="${esc(p.hashtags.join(" "))}"></div>
          <div class="campo"><label>Fecha y hora (Colombia)</label><input type="datetime-local" data-c="hora" value="${esc(p.hora_colombia.replace(" ", "T"))}"></div>`;
  }

  function botonesEstado(p, conVideo) {
    return `${p.estado === "aprobada" ? `<button class="boton chico" data-accion="desaprobar">Quitar aprobación</button>`
          : p.estado !== "publicada" && conVideo ? `<button class="boton oro chico" data-accion="aprobar">Aprobar</button>` : ""}
        ${p.estado !== "publicada" && conVideo ? `<button class="boton chico" data-accion="publicar">Publicar ahora</button>` : ""}
        ${p.estado !== "descartada" && p.estado !== "publicada" ? `<button class="boton chico" data-accion="descartar">Descartar</button>` : ""}`;
  }

  function detalle(p) {
    return p.tipo === "grabado" ? detalleGrabado(p) : detalleAuto(p);
  }

  function detalleAuto(p) {
    const armando = (p.error || "").startsWith("armando");
    const escenas = p.escenas.map((e, i) => `<div class="escena" data-i="${i}">
        <div class="fila"><select data-e="visual" aria-label="Imagen de la escena ${i + 1}">${Object.entries(VISUALES).map(([k, v]) => `<option value="${k}" ${k === e.visual ? "selected" : ""}>${v}</option>`).join("")}</select>
          <input type="text" data-e="texto" placeholder="Texto en pantalla (si es «Texto grande»)" value="${esc(e.texto || "")}" ${e.visual === "texto" ? "" : "hidden"}></div>
        <textarea data-e="voz" aria-label="Lo que dice la voz en la escena ${i + 1}">${esc(e.voz)}</textarea></div>`).join("");
    const voz = estado.voz_felipe || p.voz === "felipe" ? `<div class="campo"><label>Voz del video</label><select data-c="voz">
          <option value="apex" ${p.voz !== "felipe" ? "selected" : ""}>Voz de Apex</option>
          <option value="felipe" ${p.voz === "felipe" ? "selected" : ""} ${estado.voz_felipe ? "" : "disabled"}>Mi voz clonada</option></select></div>` : "";
    return `<div class="cuerpo">
        <div class="detalle" style="border:0;padding:0">
          <div class="campo"><label>Gancho (aparece arriba los primeros segundos)</label><input type="text" data-c="gancho" maxlength="70" value="${esc(p.gancho)}"></div>
          ${voz}
          <div class="campo"><span class="etq">Guion: lo que dice la voz y qué se ve</span>${escenas}</div>
          ${camposComunes(p)}
        </div>
        <div class="vista">${vistaVideo(p, armando, "Todavía no tiene video.")}</div>
      </div>
      <div class="acciones">
        <button class="boton chico" data-accion="guardar">Guardar cambios</button>
        <button class="boton chico" data-accion="video" ${armando ? "disabled" : ""}>${p.video ? "Rehacer video" : "Armar video"}</button>
        ${botonesEstado(p, true)}
      </div><p class="ok" aria-live="polite"></p>`;
  }

  function detalleGrabado(p) {
    const armando = (p.error || "").startsWith("armando");
    const guia = `<details class="guia" ${p.grabada ? "" : "open"}><summary>${p.grabada ? "La guía que tenía para grabar" : "Qué decir y cómo grabarlo"}</summary>
        <div class="campo"><label>Qué decir (una idea por línea; dígalo con sus palabras)</label><textarea data-c="guia" rows="4">${esc(p.escenas.map((e) => e.voz).join("\n"))}</textarea></div>
        <div class="campo"><label>Cómo grabarlo</label><input type="text" data-c="notas" maxlength="600" value="${esc(p.notas)}" placeholder="Celular vertical, a la altura de los ojos, con luz de frente"></div></details>`;
    const subs = p.grabada && p.subtitulos ? `<div class="campo"><label>Subtítulos: corrija lo que se entendió mal y toque «Corregir subtítulos»</label><textarea data-c="subtitulos" rows="4">${esc(p.subtitulos)}</textarea></div>` : "";
    const opciones = `<div class="opciones">
        <label class="check"><input type="checkbox" data-o="cortar_silencios" ${p.opciones.cortar_silencios ? "checked" : ""}> Quitar los silencios</label>
        <label class="check"><input type="checkbox" data-o="cierre" ${p.opciones.cierre ? "checked" : ""}> Cierre con mi nombre${estado.personal_cuenta ? " y mi cuenta" : ""}</label></div>`;
    return `<div class="cuerpo">
        <div class="detalle" style="border:0;padding:0">
          ${p.grabada ? "" : guia}
          <div class="campo"><label>Gancho (aparece arriba los primeros segundos)</label><input type="text" data-c="gancho" maxlength="70" value="${esc(p.gancho)}"></div>
          ${subs}
          ${opciones}
          ${camposComunes(p)}
          ${p.grabada ? guia : ""}
        </div>
        <div class="vista">${vistaVideo(p, armando, p.grabada ? "Todavía no tiene video." : "Grábelo con el celular en vertical y súbalo aquí.")}</div>
      </div>
      <input type="file" accept="video/*" data-archivo hidden>
      <div class="acciones">
        <button class="boton ${p.grabada ? "" : "oro "}chico" data-accion="subir" ${armando ? "disabled" : ""}>${p.grabada ? "Cambiar el video grabado" : "Subir mi video"}</button>
        <button class="boton chico" data-accion="guardar">Guardar cambios</button>
        ${subs ? `<button class="boton chico" data-accion="subtitulos" ${armando ? "disabled" : ""}>Corregir subtítulos</button>` : ""}
        ${p.grabada ? `<button class="boton chico" data-accion="video" ${armando ? "disabled" : ""}>Rehacer video</button>` : ""}
        ${botonesEstado(p, !!p.video)}
      </div><p class="ok" aria-live="polite"></p>`;
  }

  function abrir(t, forzar = false) {
    const p = piezas.find((x) => x.id == t.dataset.id), det = $(".detalle", t);
    if (!p) return;
    const ya = !det.hidden && !forzar;
    if (!ya) det.innerHTML = detalle(p);
    det.hidden = ya; abierta = ya ? null : p.id;
  }

  function cambios(t) {
    const p = piezas.find((x) => x.id == t.dataset.id);
    const c = { gancho: $("[data-c=gancho]", t).value, descripcion: $("[data-c=descripcion]", t).value,
      hashtags: $("[data-c=hashtags]", t).value.split(/[\s,]+/).filter(Boolean) };
    if (p.tipo === "grabado") {
      c.escenas = $("[data-c=guia]", t).value.split("\n").map((l) => l.trim()).filter(Boolean).map((voz) => ({ voz }));
      c.notas = $("[data-c=notas]", t).value;
      c.opciones = Object.fromEntries([...t.querySelectorAll("[data-o]")].map((x) => [x.dataset.o, x.checked]));
    } else {
      c.escenas = [...t.querySelectorAll(".escena")].map((s) => ({ voz: $("[data-e=voz]", s).value, visual: $("[data-e=visual]", s).value, texto: $("[data-e=texto]", s).value }));
      const voz = $("[data-c=voz]", t); if (voz) c.voz = voz.value;
    }
    const h = $("[data-c=hora]", t).value; if (h) c.hora = h.replace("T", " ").slice(0, 16);
    return c;
  }

  const guardar = (t) => api(`/api/contenido/${t.dataset.id}`, { method: "PATCH", body: JSON.stringify(cambios(t)) });

  async function subirGrabacion(id, archivo, msj) {
    await subirPorPartes(`/api/contenido/${id}/grabacion`, archivo, (n) => { msj.textContent = n < 100 ? `Subiendo su video… ${n} %` : "Video recibido. Editándolo…"; });
    abierta = Number(id); await cargar();
  }

  $("#calendario").addEventListener("click", async (e) => {
    const cab = e.target.closest(".p-cab"); if (cab) return abrir(cab.closest(".pieza"));
    const b = e.target.closest("[data-accion]"); if (!b) return;
    const t = b.closest(".pieza"), id = t.dataset.id, msj = $(".ok", t), p = piezas.find((x) => x.id == id);
    if (b.dataset.accion === "subir") return $("[data-archivo]", t).click();
    for (const viejo of t.querySelectorAll(".acciones ~ .aviso")) viejo.remove();
    b.disabled = true;
    try {
      const a = b.dataset.accion;
      if (a === "guardar") {
        const nueva = await guardar(t);
        if (p.tipo === "grabado" && p.video && !nueva.video && p.grabada) { await api(`/api/contenido/${id}/video`, { method: "POST" }); msj.textContent = "Guardado. Rehaciendo el video con los cambios…"; }
        else msj.textContent = p.video && !nueva.video ? "Guardado. Como cambió lo que se ve, toque «Armar video»." : "Guardado.";
      }
      if (a === "video") { await guardar(t); await api(`/api/contenido/${id}/video`, { method: "POST" }); }
      if (a === "subtitulos") { await guardar(t); await api(`/api/contenido/${id}/subtitulos`, { method: "POST", body: JSON.stringify({ texto: $("[data-c=subtitulos]", t).value }) }); }
      if (a === "aprobar") await api(`/api/contenido/${id}`, { method: "PATCH", body: JSON.stringify({ ...cambios(t), estado: "aprobada" }) });
      if (a === "desaprobar") await api(`/api/contenido/${id}`, { method: "PATCH", body: JSON.stringify({ estado: "propuesta" }) });
      if (a === "descartar") await api(`/api/contenido/${id}`, { method: "PATCH", body: JSON.stringify({ estado: "descartada" }) });
      if (a === "publicar") { await api(`/api/contenido/${id}/publicar`, { method: "POST" }); msj.textContent = "Publicando… tarda unos minutos."; }
      await cargar();
    } catch (err) { msj.textContent = ""; msj.insertAdjacentHTML("afterend", `<p class="aviso">${esc(err.message)}</p>`); b.disabled = false; }
  });
  $("#calendario").addEventListener("change", async (e) => {
    if (e.target.dataset.e === "visual") $("[data-e=texto]", e.target.closest(".escena")).hidden = e.target.value !== "texto";
    if (e.target.matches("[data-archivo]") && e.target.files[0]) {
      const t = e.target.closest(".pieza"), msj = $(".ok", t), archivo = e.target.files[0];
      try { await guardar(t); await subirGrabacion(t.dataset.id, archivo, msj); }
      catch (err) { msj.textContent = ""; msj.insertAdjacentHTML("afterend", `<p class="aviso">${esc(err.message)}</p>`); }
      e.target.value = "";
    }
  });
  $("#calendario").addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("p-cab")) { e.preventDefault(); abrir(e.target.closest(".pieza")); } });

  for (const b of document.querySelectorAll("[data-pestana]")) b.addEventListener("click", () => {
    pestana = b.dataset.pestana; abierta = null;
    try { localStorage.setItem("contenido-pestana", pestana); } catch (e) {}
    $("#error-general").hidden = true; $("#m-general").textContent = "";
    pintarCabeza(); pintar();
  });

  function mostrarError(err) { $("#error-general").textContent = err.message; $("#error-general").hidden = false; }

  $("#b-proponer").addEventListener("click", async (e) => {
    const b = e.currentTarget; b.disabled = true; b.textContent = "Pensando ideas…";
    try { const r = await api(`/api/contenido/proponer?cuenta=${pestana}`, { method: "POST" }); $("#error-general").hidden = true; await cargar();
      b.textContent = `${r.nuevas.length} ideas nuevas`; }
    catch (err) { mostrarError(err); b.textContent = TEXTOS[pestana].proponer; }
    b.disabled = false;
  });

  $("#b-subir-nuevo").addEventListener("click", () => $("#f-nuevo").click());
  $("#f-nuevo").addEventListener("change", async (e) => {
    const archivo = e.target.files[0]; if (!archivo) return;
    const b = $("#b-subir-nuevo"), msj = $("#m-general"); b.disabled = true; $("#error-general").hidden = true;
    try { const p = await api("/api/contenido/nueva", { method: "POST" }); await subirGrabacion(p.id, archivo, msj); msj.textContent = "Su video quedó en el calendario: lo está editando."; }
    catch (err) { msj.textContent = ""; mostrarError(err); await cargar(); }
    b.disabled = false; e.target.value = "";
  });

  const listoVoz = () => { $("#b-voz-clonar").disabled = !($("#f-voz").files[0] && $("#c-voz").checked); };
  $("#b-voz-elegir").addEventListener("click", () => $("#f-voz").click());
  $("#f-voz").addEventListener("change", () => { const f = $("#f-voz").files[0]; $("#n-voz").textContent = f ? f.name : ""; listoVoz(); });
  $("#c-voz").addEventListener("change", listoVoz);
  $("#b-voz-clonar").addEventListener("click", async (e) => {
    const b = e.currentTarget, msj = $("#m-voz"); b.disabled = true;
    try {
      await subirPorPartes("/api/contenido/voz?confirmo=1", $("#f-voz").files[0], (n) => { msj.textContent = n < 100 ? `Subiendo la muestra… ${n} %` : "Clonando su voz… tarda unos segundos."; });
      msj.textContent = "Su voz quedó lista."; $("#f-voz").value = ""; $("#n-voz").textContent = ""; $("#c-voz").checked = false; await cargar();
    } catch (err) { msj.textContent = "No se pudo: " + err.message; listoVoz(); }
  });
  $("#b-voz-borrar").addEventListener("click", async (e) => {
    if (!confirm("¿Borrar su voz clonada? Los videos que la usan no se podrán volver a armar con ella.")) return;
    const b = e.currentTarget; b.disabled = true;
    try { await api("/api/contenido/voz", { method: "DELETE" }); $("#m-voz").textContent = "Su voz clonada se borró."; await cargar(); }
    catch (err) { $("#m-voz").textContent = "No se pudo: " + err.message; }
    b.disabled = false;
  });

  pintarCabeza();
  cargar();
})();
</script>
</body>
</html>
