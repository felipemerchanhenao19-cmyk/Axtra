<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axtra</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f8bff'/%3E%3Cstop offset='.55' stop-color='%239b72cb'/%3E%3Cstop offset='1' stop-color='%23e0707a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M12 1c.6 5.6 5.4 10.4 11 11-5.6.6-10.4 5.4-11 11-.6-5.6-5.4-10.4-11-11C6.6 11.4 11.4 6.6 12 1z'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #131314; --side: #1e1f20; --surface: #1e1f20; --surface-2: #282a2c; --hover: #2d2f31;
  --text: #e3e3e3; --muted: #9aa0a6; --line: #3c4043; --accent: #a8c7fa; --danger: #f28b82;
  --user: #282a2c; --shadow: 0 1px 3px rgba(0,0,0,.35);
  --g1: #4f8bff; --g2: #9b72cb; --g3: #e0707a;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #ffffff; --side: #f0f4f9; --surface: #f0f4f9; --surface-2: #e9eef6; --hover: #dde3ea;
    --text: #1f1f1f; --muted: #5f6368; --line: #dadce0; --accent: #0b57d0; --danger: #b3261e;
    --user: #e9eef6; --shadow: 0 1px 3px rgba(60,64,67,.2);
  }
}
:root[data-theme="light"] {
  --bg: #ffffff; --side: #f0f4f9; --surface: #f0f4f9; --surface-2: #e9eef6; --hover: #dde3ea;
  --text: #1f1f1f; --muted: #5f6368; --line: #dadce0; --accent: #0b57d0; --danger: #b3261e;
  --user: #e9eef6; --shadow: 0 1px 3px rgba(60,64,67,.2);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text); display: flex; overflow: hidden;
  font: 16px/1.6 "Google Sans", "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.icon { width: 24px; height: 24px; fill: currentColor; flex: none; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--hover); color: var(--text); }

/* ---------- Barra lateral ---------- */
#side {
  width: 272px; background: var(--side); display: flex; flex-direction: column; padding: 12px;
  transition: width .2s ease; flex: none; z-index: 20;
}
#side.closed { width: 68px; }
#side.closed .label, #side.closed #recent { display: none; }
.side-row { display: flex; align-items: center; gap: 12px; }
#newchat {
  margin-top: 28px; height: 40px; border-radius: 20px; padding: 0 12px; display: flex; align-items: center;
  gap: 12px; color: var(--muted); width: fit-content; min-width: 40px;
}
#newchat:hover { background: var(--hover); color: var(--text); }
#recent { margin-top: 24px; overflow-y: auto; flex: 1; }
#recent h3 { font-size: 14px; font-weight: 500; margin: 0 12px 8px; color: var(--text); }
.chat-item {
  display: flex; align-items: center; border-radius: 20px; padding: 0 4px 0 16px; height: 36px; font-size: 14px;
  cursor: pointer; color: var(--text);
}
.chat-item:hover, .chat-item.active { background: var(--hover); }
.chat-item.active { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.chat-item span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-item button { opacity: 0; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; }
.chat-item:hover button { opacity: .7; }
.chat-item button:hover { opacity: 1; background: var(--line); }
#side-bottom { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }
.side-opt {
  height: 40px; border-radius: 20px; display: flex; align-items: center; gap: 12px; padding: 0 8px; color: var(--muted);
  font-size: 14px; white-space: nowrap;
}
.side-opt:hover { background: var(--hover); color: var(--text); }
#scrim { display: none; }

/* ---------- Principal ---------- */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
#top { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 20px; flex: none; }
#brand { display: flex; align-items: baseline; gap: 10px; }
#brand b { font-size: 22px; font-weight: 400; }
#brand small { font-size: 13px; color: var(--muted); background: var(--surface); padding: 2px 10px; border-radius: 12px; }
#menu-mobile { display: none; }
#avatar {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; color: #fff;
  background: linear-gradient(135deg, var(--g1), var(--g2));
}
#scroll { flex: 1; overflow-y: auto; }
#thread { max-width: 780px; margin: 0 auto; padding: 8px 24px 180px; }

#hello { max-width: 780px; margin: 0 auto; padding: 14vh 24px 0; }
#hello h1 {
  font-size: clamp(36px, 6vw, 56px); line-height: 1.15; font-weight: 500; margin: 0; letter-spacing: -.02em;
  background: linear-gradient(90deg, var(--g1), var(--g2) 45%, var(--g3) 75%);
  -webkit-background-clip: text; background-clip: text; color: transparent; width: fit-content;
}
#hello p { font-size: clamp(28px, 5vw, 48px); line-height: 1.2; color: var(--muted); opacity: .55; margin: 4px 0 0; font-weight: 500; letter-spacing: -.02em; }
#ideas { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 48px; }
.idea {
  background: var(--surface); border-radius: 16px; padding: 14px 16px; min-height: 110px; text-align: left; font-size: 15px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
}
.idea:hover { background: var(--hover); }
.idea .icon { align-self: flex-end; background: var(--bg); border-radius: 50%; padding: 6px; width: 34px; height: 34px; color: var(--text); }

/* ---------- Mensajes ---------- */
.msg { margin: 28px 0; }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .bubble {
  background: var(--user); border-radius: 24px 4px 24px 24px; padding: 12px 20px; max-width: 80%;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.msg.ai { display: grid; grid-template-columns: 32px 1fr; gap: 16px; }
.spark { width: 32px; height: 32px; display: grid; place-items: center; }
.spark svg { width: 26px; height: 26px; }
.thinking .spark svg { animation: spin 1.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ai-body { min-width: 0; padding-top: 3px; overflow-wrap: anywhere; }
.ai-body p { margin: 0 0 12px; }
.ai-body p:last-child { margin-bottom: 0; }
.shimmer {
  background: linear-gradient(90deg, var(--muted) 25%, var(--text) 50%, var(--muted) 75%); background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.6s linear infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }
.actions { display: flex; gap: 2px; margin-top: 8px; margin-left: -8px; }
.actions .icon-btn { width: 36px; height: 36px; }
.actions .icon { width: 20px; height: 20px; }
.actions .icon-btn.on { color: var(--accent); }
.files { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.file-img { display: block; max-width: min(460px, 100%); border-radius: 16px; overflow: hidden; background: var(--surface); }
.file-img img { display: block; width: 100%; height: auto; }
.file-chip {
  display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 14px; padding: 10px 14px;
  color: var(--text); text-decoration: none; font-size: 14px; max-width: 100%;
}
.file-chip:hover { background: var(--hover); }
.file-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-card { border: 1px solid var(--line); border-radius: 16px; margin-top: 14px; overflow: hidden; }
.doc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 8px 8px 16px; background: var(--surface); }
.doc-head span { display: flex; flex: none; }
.doc-head b { font-weight: 500; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-body { padding: 8px 20px 16px; max-height: 420px; overflow-y: auto; font-size: 15px; }
.md h1, .md h2, .md h3 { font-weight: 500; line-height: 1.3; margin: 18px 0 8px; }
.md h1 { font-size: 22px; } .md h2 { font-size: 19px; } .md h3 { font-size: 17px; }
.md ul, .md ol { margin: 0 0 12px; padding-left: 24px; }
.md code { background: var(--surface-2); border-radius: 6px; padding: 1px 6px; font-size: 14px; }
.md pre { background: var(--surface); border-radius: 12px; padding: 14px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; margin: 8px 0 14px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; }
.md a { color: var(--accent); }

/* ---------- Caja de texto ---------- */
#dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 24px 10px; background: linear-gradient(transparent, var(--bg) 26%); }
#box {
  max-width: 780px; margin: 0 auto; background: var(--surface); border-radius: 28px; padding: 10px 10px 8px 22px;
  box-shadow: var(--shadow);
}
#box:focus-within { background: var(--surface-2); }
#input {
  width: 100%; border: 0; outline: 0; resize: none; background: transparent; color: var(--text); font: inherit;
  max-height: 220px; padding: 8px 0 4px; display: block;
}
#input::placeholder { color: var(--muted); }
#box-row { display: flex; align-items: center; gap: 6px; margin-left: -12px; }
.tool {
  height: 36px; border-radius: 18px; padding: 0 12px; display: flex; align-items: center; gap: 6px; color: var(--muted);
  font-size: 14px;
}
.tool .icon { width: 20px; height: 20px; }
.tool:hover { background: var(--hover); color: var(--text); }
.tool.on { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
#box-row .grow { flex: 1; }
#mic.rec { color: #fff; background: var(--danger); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--danger) 30%, transparent); } }
#send { color: var(--text); }
#send:disabled { color: var(--muted); opacity: .45; cursor: default; background: none; }
#note { text-align: center; font-size: 12px; color: var(--muted); margin: 8px 0 0; }
#speaking {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 150px; display: none; align-items: center; gap: 10px;
  background: var(--surface-2); border-radius: 22px; padding: 6px 8px 6px 16px; box-shadow: var(--shadow); font-size: 14px;
}
#speaking.show { display: flex; }
.bars { display: flex; gap: 3px; align-items: center; height: 16px; }
.bars i { width: 3px; background: var(--accent); border-radius: 2px; animation: bar 0.9s ease-in-out infinite; }
.bars i:nth-child(2) { animation-delay: .15s; } .bars i:nth-child(3) { animation-delay: .3s; } .bars i:nth-child(4) { animation-delay: .45s; }
@keyframes bar { 0%,100% { height: 4px; } 50% { height: 16px; } }

#login { position: fixed; inset: 0; background: var(--bg); display: none; place-items: center; z-index: 50; padding: 16px; }
#login.show { display: grid; }
#login form { background: var(--surface); padding: 28px; border-radius: 24px; width: min(360px, 100%); display: grid; gap: 14px; }
#login input { font: inherit; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
#login button { background: var(--accent); color: var(--bg); border-radius: 20px; height: 42px; font-weight: 500; }
#login .err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 0; }

@media (max-width: 760px) {
  #side { position: fixed; inset: 0 auto 0 0; transform: translateX(-100%); transition: transform .2s ease; width: 280px; }
  #side.closed { width: 280px; }
  #side.closed .label, #side.closed #recent { display: revert; }
  #side.mobile-open { transform: none; }
  #scrim.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 15; }
  #menu-mobile { display: grid; }
  #thread, #hello { padding-left: 16px; padding-right: 16px; }
  #dock { padding: 0 12px 8px; }
  .msg.ai { grid-template-columns: 1fr; gap: 4px; }
  .tool .label { display: none; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8bff"/><stop offset=".55" stop-color="#9b72cb"/><stop offset="1" stop-color="#e0707a"/>
    </linearGradient>
  </defs>
  <symbol id="i-spark" viewBox="0 0 24 24"><path fill="url(#grad)" d="M12 1c.6 5.6 5.4 10.4 11 11-5.6.6-10.4 5.4-11 11-.6-5.6-5.4-10.4-11-11C6.6 11.4 11.4 6.6 12 1z"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></symbol>

  <symbol id="i-volx" viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12a9 9 0 0 0-7-8.77v2.06A7 7 0 0 1 19 12zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a9 9 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></symbol>

</svg>

<nav id="side" aria-label="Conversaciones">
  <div class="side-row">
    <button class="icon-btn" id="menu" title="Menú"><svg class="icon"><use href="#i-menu"/></svg></button>
  </div>
  <button id="newchat" title="Nuevo chat"><svg class="icon"><use href="#i-edit"/></svg><span class="label">Nuevo chat</span></button>
  <div id="recent"><h3>Recientes</h3><div id="chats"></div></div>
  <div id="side-bottom">
    <button class="side-opt" id="voice-toggle"><svg class="icon"><use href="#i-vol"/></svg><span class="label">Voz: activada</span></button>
    <button class="side-opt" id="theme-toggle"><svg class="icon"><use href="#i-theme"/></svg><span class="label">Tema</span></button>
  </div>
</nav>
<div id="scrim"></div>

<main id="main">
  <header id="top">
    <div class="side-row">
      <button class="icon-btn" id="menu-mobile" title="Menú"><svg class="icon"><use href="#i-menu"/></svg></button>
      <div id="brand"><b>Axtra</b><small>tu IA personal</small></div>
    </div>
    <div id="avatar" title="Usted">F</div>
  </header>

  <div id="scroll">
    <section id="hello">
      <h1 id="hello-name">Hola, señor</h1>
      <p>¿En qué le ayudo hoy?</p>
      <div id="ideas">
        <button class="idea" data-q="¿Cómo va el mercado hoy?">¿Cómo va el mercado hoy?<svg class="icon"><use href="#i-chart"/></svg></button>
        <button class="idea" data-q="Dame ideas para mejorar Apex">Dame ideas para mejorar Apex<svg class="icon"><use href="#i-bulb"/></svg></button>
        <button class="idea" data-q="Crea una imagen de un orbe futurista flotando sobre una mesa de restaurante" >Crea una imagen de un orbe futurista<svg class="icon"><use href="#i-img"/></svg></button>
        <button class="idea" data-q="Haz un documento con un plan de estudio de inglés para 30 días">Haz un documento: plan de inglés de 30 días<svg class="icon"><use href="#i-doc"/></svg></button>
      </div>
    </section>
    <div id="thread" aria-live="polite"></div>
  </div>

  <div id="speaking" role="status"><span class="bars"><i></i><i></i><i></i><i></i></span>Axtra está hablando
    <button class="icon-btn" id="stop-voice" title="Detener la voz"><svg class="icon"><use href="#i-stop"/></svg></button>
  </div>

  <div id="dock">
    <form id="box">
      <textarea id="input" rows="1" placeholder="Pregúntale a Axtra" aria-label="Mensaje para Axtra"></textarea>
      <div id="box-row">
        <button type="button" class="tool" data-mode="imagen" title="Crear una imagen"><svg class="icon"><use href="#i-img"/></svg><span class="label">Imagen</span></button>
        <button type="button" class="tool" data-mode="documento" title="Crear un documento Word"><svg class="icon"><use href="#i-doc"/></svg><span class="label">Documento</span></button>
        <span class="grow"></span>
        <button type="button" class="icon-btn" id="mic" title="Hablarle a Axtra"><svg class="icon"><use href="#i-mic"/></svg></button>
        <button type="submit" class="icon-btn" id="send" title="Enviar" disabled><svg class="icon"><use href="#i-send"/></svg></button>
      </div>
    </form>
    <p id="note">Axtra puede equivocarse. Todo lo que responde lo dice en voz alta.</p>
  </div>
</main>

<div id="login"><form>
  <b>Axtra</b>
  <input type="password" id="pass" placeholder="Clave de acceso" autocomplete="current-password">
  <p class="err" id="pass-err"></p>
  <button type="submit">Entrar</button>
</form></div>

<script>
const $ = (s) => document.querySelector(s);
const thread = $("#thread"), scroller = $("#scroll"), input = $("#input"), sendBtn = $("#send");
const store = {
  get(k, d) { try { const v = localStorage.getItem("axtra." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("axtra." + k, JSON.stringify(v)); } catch {} },
};
let chatId = null, mode = null, busy = false, voiceOn = store.get("voz", true);

// ---------- Utilidades ----------
function esc(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function inline(s) {
  return s.replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}
function md(text) {
  const lines = esc(text).split("\n"); let html = "", list = null, table = [], code = null;
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  const flushTable = () => {
    if (!table.length) return;
    const rows = table.filter((r) => !/^\|?[\s:\-|]+\|?$/.test(r));
    html += "<table>" + rows.map((r, i) => "<tr>" + r.replace(/^\||\|$/g, "").split("|")
      .map((c) => i ? `<td>${inline(c.trim())}</td>` : `<th>${inline(c.trim())}</th>`).join("") + "</tr>").join("") + "</table>";
    table = [];
  };
  for (const raw of lines) {
    const l = raw.trimEnd();
    if (code !== null) { if (l.startsWith("```")) { html += `<pre><code>${code}</code></pre>`; code = null; } else code += raw + "\n"; continue; }
    if (l.startsWith("```")) { closeList(); flushTable(); code = ""; continue; }
    if (l.trim().startsWith("|")) { closeList(); table.push(l.trim()); continue; }
    flushTable();
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { closeList(); const n = Math.min(m[1].length, 3); html += `<h${n}>${inline(m[2])}</h${n}>`; }
    else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { closeList(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { closeList(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[1])}</li>`; }
    else if (!l.trim()) closeList();
    else { closeList(); html += `<p>${inline(l)}</p>`; }
  }
  closeList(); flushTable(); if (code !== null) html += `<pre><code>${code}</code></pre>`;
  return html;
}
function svg(id) { return `<svg class="icon"><use href="#${id}"/></svg>`; }
function scrollDown() { scroller.scrollTop = scroller.scrollHeight; }
async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (r.status === 401) { showLogin(); throw new Error("Se necesita la clave"); }
  return r;
}

// ---------- Voz de Axtra ----------
const voice = { queue: [], playing: false, audio: null, token: 0 };
function setSpeaking(on) { $("#speaking").classList.toggle("show", on); }
function stopVoice() {
  voice.token++; voice.queue = [];
  if (voice.audio) { voice.audio.pause(); voice.audio = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  setSpeaking(false);
  document.querySelectorAll(".speak-btn.on").forEach((b) => b.classList.remove("on"));
}
async function fetchAudio(text) {
  const r = await api("/api/voz", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ texto: text }) });
  if (!r.ok) throw new Error("voz");
  return URL.createObjectURL(await r.blob());
}
function browserSay(text, token) {
  return new Promise((done) => {
    if (!("speechSynthesis" in window)) return done();
    const u = new SpeechSynthesisUtterance(text); u.lang = "es-ES";
    u.onend = u.onerror = done;
    if (token === voice.token) speechSynthesis.speak(u); else done();
  });
}
async function speak(chunks, btn) {
  stopVoice();
  if (!chunks || !chunks.length) return;
  const token = voice.token;
  setSpeaking(true); if (btn) btn.classList.add("on");
  let next = fetchAudio(chunks[0]).catch(() => null);
  for (let i = 0; i < chunks.length; i++) {
    const url = await next;
    if (token !== voice.token) return;
    next = i + 1 < chunks.length ? fetchAudio(chunks[i + 1]).catch(() => null) : null;   // prepara la siguiente frase
    if (!url) { await browserSay(chunks[i], token); continue; }
    await new Promise((done) => {
      const a = new Audio(url); voice.audio = a;
      a.onended = a.onerror = () => { URL.revokeObjectURL(url); done(); };
      a.play().catch(done);
    });
    if (token !== voice.token) return;
  }
  setSpeaking(false); if (btn) btn.classList.remove("on");
}
function splitForVoice(text) {
  const clean = text.replace(/[#*_`>|]/g, " ").replace(/https?:\/\/\S+/g, "").replace(/\s+/g, " ").trim();
  const parts = clean.match(/[^.!?]+[.!?]*/g) || [clean];
  const out = []; let cur = "";
  for (const p of parts) { if (cur && (cur + p).length > (out.length ? 180 : 90)) { out.push(cur.trim()); cur = p; } else cur += p; }
  if (cur.trim()) out.push(cur.trim());
  return out;
}

// ---------- Mensajes ----------
function hideHello() { $("#hello").style.display = "none"; }
function addUser(text) {
  hideHello();
  const el = document.createElement("div"); el.className = "msg user";
  el.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  thread.append(el); scrollDown();
}
function addThinking(label) {
  hideHello();
  const el = document.createElement("div"); el.className = "msg ai thinking";
  el.innerHTML = `<div class="spark"><svg><use href="#i-spark"/></svg></div><div class="ai-body"><span class="shimmer">${esc(label)}</span></div>`;
  thread.append(el); scrollDown(); return el;
}
function fileHtml(f) {
  if (f.tipo === "imagen") return `<a class="file-img" href="${esc(f.url)}" target="_blank" rel="noopener"><img src="${esc(f.url)}" alt="${esc(f.nombre)}" loading="lazy"></a>`;
  const icon = /\.(docx?|pdf|md|txt)$/i.test(f.nombre) ? "i-doc" : "i-down";
  return `<a class="file-chip" href="${esc(f.url)}" target="_blank" rel="noopener" download>${svg(icon)}<span>${esc(f.nombre)}</span></a>`;
}
function fillAi(el, r, autoSpeak) {
  el.classList.remove("thinking");
  const files = (r.archivos || []);
  const word = files.find((f) => /\.docx$/i.test(f.nombre));
  let html = `<div class="md">${md(r.texto || "")}</div>`;
  if (r.markdown) {
    const title = (r.markdown.match(/^#\s+(.+)$/m) || [, "Documento"])[1];
    html += `<div class="doc-card"><div class="doc-head"><b>${esc(title)}</b><span>
      <button class="icon-btn speak-doc" title="Escuchar el documento">${svg("i-vol")}</button>
      ${word ? `<a class="icon-btn" href="${esc(word.url)}" download title="Descargar en Word">${svg("i-down")}</a>` : ""}
      </span></div><div class="doc-body md">${md(r.markdown)}</div></div>`;
  }
  const others = files.filter((f) => !(r.markdown && f === word));
  if (others.length) html += `<div class="files">${others.map(fileHtml).join("")}</div>`;
  html += `<div class="actions">
    <button class="icon-btn speak-btn" title="Escuchar">${svg("i-vol")}</button>
    <button class="icon-btn copy-btn" title="Copiar">${svg("i-copy")}</button></div>`;
  el.querySelector(".ai-body").innerHTML = html;
  const chunks = r.voz || splitForVoice(r.texto || "");
  const btn = el.querySelector(".speak-btn");
  btn.onclick = () => btn.classList.contains("on") ? stopVoice() : speak(chunks, btn);
  el.querySelector(".copy-btn").onclick = () => navigator.clipboard?.writeText(r.markdown || r.texto || "");
  const sd = el.querySelector(".speak-doc");
  if (sd) sd.onclick = () => sd.classList.contains("on") ? stopVoice() : speak(splitForVoice(r.markdown), sd);
  if (autoSpeak && voiceOn) speak(chunks, btn);
  scrollDown();
}

async function send(text, forcedMode) {
  text = (text || "").trim();
  if (!text || busy) return;
  busy = true; stopVoice();
  const m = forcedMode || mode;
  addUser(text); input.value = ""; autoGrow(); updateSend();
  const el = addThinking(m === "imagen" ? "Creando la imagen..." : m === "documento" ? "Escribiendo el documento..." : "Pensando...");
  try {
    const r = await api("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ texto: text, chat_id: chatId, modo: m || "auto" }) });
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    const isNew = chatId !== data.chat_id; chatId = data.chat_id;
    fillAi(el, data, true);
    if (isNew) loadChats();
    setMode(null);
  } catch (e) {
    fillAi(el, { texto: "No pude comunicarme con Axtra: " + e.message + ". Revise que la terminal de Axtra web siga abierta.", voz: [] }, false);
  } finally { busy = false; updateSend(); }
}

// ---------- Conversaciones ----------
async function loadChats() {
  let list = [];
  try { list = await (await api("/api/chats")).json(); } catch { return; }
  const box = $("#chats"); box.innerHTML = "";
  for (const c of list) {
    const it = document.createElement("div");
    it.className = "chat-item" + (c.id === chatId ? " active" : "");
    it.innerHTML = `<span>${esc(c.titulo)}</span><button title="Borrar">${svg("i-del")}</button>`;
    it.onclick = () => openChat(c.id);
    it.querySelector("button").onclick = async (ev) => {
      ev.stopPropagation();
      if (!confirm("¿Borrar esta conversación?")) return;
      await api("/api/chats/" + c.id, { method: "DELETE" });
      if (c.id === chatId) newChat(); else loadChats();
    };
    box.append(it);
  }
}
async function openChat(id) {
  stopVoice(); closeMobile();
  const c = await (await api("/api/chats/" + id)).json();
  if (c.error) return;
  chatId = id; thread.innerHTML = ""; hideHello();
  for (const m of c.mensajes) {
    if (m.rol === "usuario") addUser(m.texto);
    else { const el = addThinking(""); fillAi(el, m, false); }
  }
  loadChats();
}
function newChat() {
  stopVoice(); closeMobile(); chatId = null; thread.innerHTML = ""; $("#hello").style.display = ""; loadChats(); input.focus();
}

// ---------- Micrófono (el audio lo entiende Axtra en el PC, con su mismo oído) ----------
const rec = { on: false };
async function startRec() {
  if (!navigator.mediaDevices?.getUserMedia) { alert("El micrófono solo funciona abriendo Axtra en este PC (http://localhost)."); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch { alert("No tengo permiso para usar el micrófono. Permítalo en el candado de la barra de direcciones."); return; }
  stopVoice();
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const src = ctx.createMediaStreamSource(stream);
  const node = ctx.createScriptProcessor(4096, 1, 1);
  const chunks = []; let heard = false, quiet = 0; const t0 = Date.now();
  node.onaudioprocess = (e) => {
    const d = new Float32Array(e.inputBuffer.getChannelData(0)); chunks.push(d);
    let sum = 0; for (const v of d) sum += v * v; const rms = Math.sqrt(sum / d.length);
    if (rms > 0.02) { heard = true; quiet = 0; } else if (heard) quiet += d.length / ctx.sampleRate;
    if ((heard && quiet > 1.6) || Date.now() - t0 > 30000) stopRec();   // se detiene solo al callarse
  };
  src.connect(node); node.connect(ctx.destination);
  Object.assign(rec, { on: true, stream, ctx, node, chunks });
  $("#mic").classList.add("rec"); $("#mic").title = "Detener y enviar";
  input.placeholder = "Escuchando... hable ahora";
}
function toWav(chunks, rate) {
  const total = chunks.reduce((n, c) => n + c.length, 0), data = new Float32Array(total);
  let o = 0; for (const c of chunks) { data.set(c, o); o += c.length; }
  const ratio = rate / 16000, n = Math.floor(total / ratio), pcm = new Int16Array(n);
  for (let i = 0; i < n; i++) {
    const a = Math.floor(i * ratio), b = Math.min(total, Math.floor((i + 1) * ratio));
    let s = 0; for (let j = a; j < b; j++) s += data[j];
    const v = Math.max(-1, Math.min(1, s / Math.max(1, b - a))); pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
  }
  const buf = new ArrayBuffer(44 + pcm.length * 2), dv = new DataView(buf);
  const w = (p, s) => [...s].forEach((ch, i) => dv.setUint8(p + i, ch.charCodeAt(0)));
  w(0, "RIFF"); dv.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); dv.setUint32(24, 16000, true);
  dv.setUint32(28, 32000, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); w(36, "data");
  dv.setUint32(40, pcm.length * 2, true); new Int16Array(buf, 44).set(pcm);
  return new Blob([buf], { type: "audio/wav" });
}
async function stopRec() {
  if (!rec.on) return;
  rec.on = false;
  rec.node.disconnect(); rec.stream.getTracks().forEach((t) => t.stop());
  const rate = rec.ctx.sampleRate; rec.ctx.close();
  $("#mic").classList.remove("rec"); $("#mic").title = "Hablarle a Axtra";
  input.placeholder = "Entendiendo...";
  try {
    const r = await api("/api/escuchar", { method: "POST", headers: { "Content-Type": "audio/wav" }, body: toWav(rec.chunks, rate) });
    const data = await r.json();
    if (data.texto) send(data.texto);
    else if (data.error) alert("No pude entender el audio: " + data.error);
  } catch (e) { alert("No pude entender el audio: " + e.message); }
  finally { input.placeholder = "Pregúntale a Axtra"; }
}

// ---------- Controles ----------
function autoGrow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 220) + "px"; }
function updateSend() { sendBtn.disabled = busy || !input.value.trim(); }
function setMode(m) {
  mode = m;
  document.querySelectorAll(".tool").forEach((b) => b.classList.toggle("on", b.dataset.mode === m));
  input.placeholder = m === "imagen" ? "Describa la imagen que quiere" : m === "documento" ? "¿Qué documento le preparo?" : "Pregúntale a Axtra";
}
function renderVoiceToggle() {
  const b = $("#voice-toggle");
  b.querySelector("use").setAttribute("href", voiceOn ? "#i-vol" : "#i-volx");
  b.querySelector(".label").textContent = voiceOn ? "Voz: activada" : "Voz: apagada";
}
function closeMobile() { $("#side").classList.remove("mobile-open"); $("#scrim").classList.remove("show"); }
function showLogin() { $("#login").classList.add("show"); $("#pass").focus(); }

input.addEventListener("input", () => { autoGrow(); updateSend(); });
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); } });
$("#box").addEventListener("submit", (e) => { e.preventDefault(); send(input.value); });
document.querySelectorAll(".tool").forEach((b) => b.onclick = () => { setMode(mode === b.dataset.mode ? null : b.dataset.mode); input.focus(); });
document.querySelectorAll(".idea").forEach((b) => b.onclick = () => send(b.dataset.q));
$("#mic").onclick = () => rec.on ? stopRec() : startRec();
$("#stop-voice").onclick = stopVoice;
$("#newchat").onclick = newChat;
$("#menu").onclick = () => {
  if (matchMedia("(max-width: 760px)").matches) return closeMobile();
  $("#side").classList.toggle("closed"); store.set("lateral", $("#side").classList.contains("closed"));
};
$("#menu-mobile").onclick = () => { $("#side").classList.add("mobile-open"); $("#scrim").classList.add("show"); };
$("#scrim").onclick = closeMobile;
$("#voice-toggle").onclick = () => { voiceOn = !voiceOn; store.set("voz", voiceOn); renderVoiceToggle(); if (!voiceOn) stopVoice(); };
$("#theme-toggle").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  const next = cur === "light" ? "dark" : "light"; document.documentElement.dataset.theme = next; store.set("tema", next);
};
document.addEventListener("keydown", (e) => { if (e.key === "Escape") stopVoice(); });
$("#login form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ clave: $("#pass").value }) });
  if (r.ok) { $("#login").classList.remove("show"); loadChats(); } else $("#pass-err").textContent = "Clave incorrecta";
});

(async function start() {
  const t = store.get("tema", null); if (t) document.documentElement.dataset.theme = t;
  if (store.get("lateral", false)) $("#side").classList.add("closed");
  renderVoiceToggle();
  try {
    const s = await (await fetch("/api/estado")).json();
    $("#hello-name").textContent = "Hola, " + s.usuario;
    $("#avatar").textContent = (s.usuario || "F")[0].toUpperCase();
    if (s.necesita_clave) return showLogin();
  } catch {}
  loadChats(); input.focus();
})();
</script>
