<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex Play · Menú</title>
<meta name="theme-color" content="#0b1626">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Figtree:wght@400;500;600;700;800&display=swap">
<script src="/web/apex-voz.js?v=5"></script>

<style>
/* Layout: una app de celular (máx. 460 px) centrada; tres pantallas: orbe de entrada, carta, pedido enviado. Más la vista de la caja. */
:root {
  --noche: #0b1626; --tarjeta: #121e30; --tarjeta-2: #18263b; --tinta: #eef3fa; --suave: #93a4bb;
  --hielo: #3fd0ff; --hielo-claro: #8be9ff; --oro: #f5c26b; --verde: #43d39e; --rojo: #ff8a80;
  --linea: rgba(139,233,255,.14);
  --f-titulo: "Italiana", "Didot", Georgia, serif;
  --f-cuerpo: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: #060c16; color: var(--tinta); font: 16px/1.45 var(--f-cuerpo); }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; border-radius: 999px; }
button:focus-visible { outline: 2px solid var(--hielo-claro); outline-offset: 2px; }
.app { max-width: 460px; min-height: 100%; margin: 0 auto; position: relative; overflow: hidden;
  background: radial-gradient(120% 40% at 50% 0%, #143a66 0%, var(--noche) 70%) no-repeat, var(--noche); }
.pantalla[hidden] { display: none !important; }
canvas { display: block; width: 100%; height: 100%; }

/* ---------- 1. Entrada ---------- */
.entrada { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 32px 20px; }
.entrada small { font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: var(--hielo-claro); border: 1px solid var(--linea); border-radius: 99px; padding: 6px 14px; }
.entrada h1 { font: 400 44px/1.05 var(--f-titulo); margin-top: 16px; }
.orbe-entrada { width: 260px; height: 260px; margin: 6px auto 0; border-radius: 50%; display: block; animation: llama 2.4s ease-in-out infinite; }
@keyframes llama { 50% { transform: scale(1.04); } }
.entrada p { color: var(--suave); margin-top: 4px; }
.entrada .toque { color: var(--hielo-claro); font-weight: 700; font-size: 18px; margin-top: 6px; }
.marca { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 13px; color: var(--suave); margin-top: 26px; }
.marca i { width: 18px; height: 18px; border-radius: 5px; background: var(--hielo); display: grid; place-items: center; }
.marca i::after { content: ""; margin-left: 2px; border-left: 7px solid var(--noche); border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }

/* ---------- 2. Carta ---------- */
.cabeza { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; padding: 12px 16px 10px; background: linear-gradient(var(--noche) 78%, rgba(11,22,38,0)); }
.fila-cabeza { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.fila-cabeza .rest { font: 400 24px/1 var(--f-titulo); }
.fila-cabeza .mesa { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--suave); }
.chip { font-size: 13px; font-weight: 600; border: 1px solid var(--linea); padding: 7px 12px; color: var(--tinta); }
.chip.on { background: var(--tarjeta-2); }
.orbe-zona { display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: center; margin-top: 8px; }
.orbe-arriba { width: 96px; height: 96px; }
.globo { background: rgba(63,208,255,.12); border: 1px solid rgba(63,208,255,.35); border-radius: 18px 18px 18px 6px; padding: 10px 12px; font-size: 14.5px; color: #dff6ff; min-height: 58px; display: grid; gap: 8px; align-content: center; }
.globo .acciones-globo { display: flex; gap: 8px; flex-wrap: wrap; }
.globo .acciones-globo button { background: var(--hielo); color: #04121c; font-weight: 800; font-size: 13px; padding: 7px 12px; }
.globo .acciones-globo button.no { background: transparent; color: var(--tinta); border: 1px solid var(--linea); font-weight: 600; }

.carta { padding: 4px 16px 130px; display: grid; gap: 14px; }
.seccion-titulo { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--hielo); font-weight: 700; margin-top: 6px; }
.plato { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 22px; display: grid; grid-template-columns: 112px 1fr; gap: 14px; padding: 12px; align-items: center; transition: border-color .3s, box-shadow .3s; }
.plato.elegido { border-color: rgba(63,208,255,.6); box-shadow: 0 0 0 3px rgba(63,208,255,.12); }
.foto { width: 112px; height: 112px; border-radius: 16px; background: radial-gradient(circle at 50% 45%, #22406a, #0f1b2d 75%); display: grid; place-items: center; }
.foto svg { width: 100px; height: 100px; }
.plato .info { min-width: 0; display: grid; gap: 4px; }
.plato h3 { font-size: 17px; font-weight: 700; line-height: 1.2; }
.plato p { font-size: 13px; color: var(--suave); line-height: 1.35; }
.plato .pie-plato { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.precio { color: var(--oro); font-weight: 800; font-variant-numeric: tabular-nums; }
.precio s { color: var(--suave); font-weight: 500; font-size: 12px; margin-right: 4px; }
.pedir { background: var(--hielo); color: #04121c; font-weight: 800; padding: 9px 18px; }
.contador { display: flex; align-items: center; gap: 4px; background: var(--tarjeta-2); border: 1px solid var(--linea); border-radius: 99px; padding: 3px; }
.contador button { width: 34px; height: 34px; display: grid; place-items: center; font-size: 20px; font-weight: 700; background: rgba(255,255,255,.06); }
.contador button.mas { background: var(--hielo); color: #04121c; }
.contador b { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.oferta-tag { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .12em; background: var(--oro); color: #2a1a02; padding: 3px 7px; border-radius: 6px; justify-self: start; }

.barra { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 460px; z-index: 6; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(rgba(11,22,38,0), var(--noche) 30%); }
.ver-pedido { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: linear-gradient(90deg, #1565c0, var(--hielo)); color: #fff; font-weight: 800; padding: 15px 20px; box-shadow: 0 12px 30px -10px rgba(63,208,255,.6); }
.ver-pedido:disabled { opacity: .35; box-shadow: none; cursor: default; }
.ver-pedido .cuantos { background: rgba(255,255,255,.22); border-radius: 99px; padding: 2px 10px; font-size: 14px; }

/* Hoja del pedido */
.velo { position: fixed; inset: 0; background: rgba(2,6,12,.6); z-index: 8; }
.hoja { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 460px; z-index: 9; background: #0f1a2b; border-top: 1px solid var(--linea); border-radius: 26px 26px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 86vh; overflow-y: auto; animation: sube .28s ease both; }
@keyframes sube { from { transform: translate(-50%, 40px); opacity: 0; } }
.agarre { width: 42px; height: 5px; border-radius: 9px; background: #2a3a52; margin: 0 auto 12px; }
.hoja h2 { font: 400 32px/1.1 var(--f-titulo); }
.hoja .sub { color: var(--suave); font-size: 14px; margin-top: 2px; }
.lineas { display: grid; gap: 10px; margin-top: 16px; }
.linea { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 16px; padding: 12px 14px; }
.linea b { font-size: 15px; } .linea .sub-l { color: var(--oro); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.linea .ctrl { display: flex; align-items: center; gap: 8px; grid-row: span 2; grid-column: 2; grid-row-start: 1; }
.quitar { color: var(--rojo); font-size: 13px; font-weight: 700; padding: 8px 10px; border: 1px solid rgba(255,138,128,.35); }
.total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px; padding-top: 14px; border-top: 1px dashed #2a3a52; font-size: 18px; font-weight: 800; }
.total span:last-child { color: var(--oro); font-variant-numeric: tabular-nums; }
.confirmar { width: 100%; margin-top: 16px; background: var(--verde); color: #04140d; font-weight: 800; font-size: 17px; padding: 16px; }
.seguir { width: 100%; margin-top: 8px; padding: 12px; color: var(--suave); font-weight: 600; }
.vacio { color: var(--suave); text-align: center; padding: 26px 0 8px; }

/* Oferta antes de enviar */
.oferta { margin-top: 16px; display: grid; grid-template-columns: 70px 1fr; gap: 14px; align-items: center; background: linear-gradient(135deg, rgba(245,194,107,.16), rgba(245,194,107,.04)); border: 1px solid rgba(245,194,107,.45); border-radius: 20px; padding: 14px; }
.oferta .mini-orbe { width: 70px; height: 70px; }
.oferta p { font-size: 15px; } .oferta p b { color: var(--oro); }
.oferta .botones { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.oferta .si { background: var(--oro); color: #2a1a02; font-weight: 800; padding: 10px 16px; }
.oferta .no { border: 1px solid var(--linea); padding: 10px 16px; font-weight: 600; }

/* ---------- 3. Enviado ---------- */
.enviado { min-height: 100vh; display: grid; align-content: center; gap: 18px; padding: 30px 20px; text-align: center; }
.check { width: 92px; height: 92px; border-radius: 50%; background: var(--verde); margin: 0 auto; display: grid; place-items: center; box-shadow: 0 0 0 12px rgba(67,211,158,.15); animation: aparece .45s cubic-bezier(.2,1.6,.4,1) both; }
.check svg { width: 46px; height: 46px; fill: none; stroke: #04140d; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
@keyframes aparece { from { transform: scale(.4); opacity: 0; } }
.enviado h2 { font: 400 38px/1.1 var(--f-titulo); }
.enviado .sub { color: var(--suave); }
.recibo { text-align: left; background: #f7f3ea; color: #1d1a14; border-radius: 8px; padding: 16px 18px 20px; font: 14px/1.55 "Courier New", ui-monospace, monospace; position: relative; }
.recibo::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px; background: radial-gradient(circle at 6px 0, transparent 6px, #f7f3ea 6.5px) 0 0 / 12px 8px repeat-x; }
.recibo h3 { font: 800 14px/1 var(--f-cuerpo); letter-spacing: .12em; text-transform: uppercase; display: flex; justify-content: space-between; border-bottom: 1px dashed #b9b0a0; padding-bottom: 10px; margin-bottom: 8px; }
.recibo .r-linea { display: flex; justify-content: space-between; gap: 10px; }
.recibo .r-total { border-top: 1px dashed #b9b0a0; margin-top: 8px; padding-top: 8px; display: flex; justify-content: space-between; font-weight: 700; }
.botones-fin { display: grid; gap: 10px; }
.principal { background: var(--hielo); color: #04121c; font-weight: 800; padding: 15px; }
.secundario { border: 1px solid var(--linea); padding: 13px; font-weight: 600; }

/* ---------- Vista de la caja ---------- */
.caja { min-height: 100vh; padding: 20px 16px 40px; display: grid; gap: 16px; align-content: start; background: #0a1220; }
.caja-cabeza { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.caja-cabeza h2 { font: 400 30px/1 var(--f-titulo); }
.en-vivo { font-size: 12px; font-weight: 700; color: var(--verde); display: flex; align-items: center; gap: 6px; }
.en-vivo::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--verde); animation: late 1.2s infinite; }
@keyframes late { 50% { opacity: .3; } }
.orden { background: var(--tarjeta); border: 1px solid var(--linea); border-left: 4px solid var(--hielo); border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; animation: sube2 .4s ease both; }
@keyframes sube2 { from { transform: translateY(-10px); opacity: 0; } }
.orden.nueva { border-left-color: var(--oro); }
.orden-cabeza { display: flex; justify-content: space-between; gap: 10px; font-weight: 800; }
.orden-cabeza span:last-child { color: var(--suave); font-weight: 500; font-size: 14px; }
.orden ul { margin: 0; padding-left: 18px; color: #d4deea; font-size: 15px; }
.orden .sugerido { color: var(--verde); font-size: 12px; font-weight: 700; margin-left: 6px; }
.orden-pie { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.orden-pie b { color: var(--oro); }
.estado-btn { background: var(--oro); color: #2a1a02; font-weight: 800; font-size: 13px; padding: 8px 14px; }
.estado-btn.listo { background: var(--verde); color: #04140d; }
.nota { color: var(--suave); font-size: 13px; }

.aviso { position: fixed; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px)); z-index: 20; background: var(--oro); color: #2a1a02; font-weight: 800; padding: 12px 18px; border-radius: 16px; width: calc(100% - 32px); max-width: 428px; text-align: center; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<style>
/* Extra del modelo conectado: estado de escucha y lo que dijo el cliente */
.estado-orbe { font-size: 11px; color: var(--hielo-claro); text-align: center; margin-top: -4px; min-height: 15px; }
.orbe-arriba { cursor: pointer; }
.dijo { font-size: 12.5px; color: var(--suave); font-style: italic; }
.dijo:empty { display: none; }
.caja-link { text-decoration: none; display: block; text-align: center; color: var(--tinta); }
.idiomas { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.idiomas::-webkit-scrollbar { display: none; }
.idiomas button { flex: none; font-size: 13px; font-weight: 600; color: var(--suave); border: 1px solid var(--linea); padding: 6px 11px; }
.idiomas button[aria-pressed="true"] { background: var(--tinta); color: var(--noche); border-color: var(--tinta); }
.entrada .idiomas { justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.cabeza .idiomas { margin-top: 8px; }
.orbe-arriba { padding: 0; display: block; }
.orbe-arriba.escucha { filter: drop-shadow(0 0 14px rgba(63,208,255,.9)); }
.qr-boton { color: var(--tinta); font-size: 14px; font-weight: 700; margin-top: 18px; padding: 10px 18px; border: 1px solid var(--linea); }
.qr-velo { position: fixed; inset: 0; z-index: 30; background: rgba(2,6,12,.85); display: grid; place-items: center; padding: 20px; }
.qr-caja { background: #fff; color: #0b1626; border-radius: 28px; padding: 24px; width: min(100%, 360px); display: grid; gap: 10px; justify-items: center; text-align: center; }
.qr-caja .qr { width: 100%; aspect-ratio: 1; max-width: 100%; } .qr-caja .qr svg { width: 100%; height: 100%; display: block; }
.qr-caja b { font: 400 30px/1 var(--f-titulo); } .qr-caja span { font-size: 13px; color: #4a586b; overflow-wrap: anywhere; }
.qr-caja button { background: #0b1626; color: #fff; font-weight: 700; padding: 11px 22px; margin-top: 4px; }
</style>
</head>
<body>
<div class="app">
  <!-- 1. Entrada: solo el orbe -->
  <section class="pantalla entrada" id="p-entrada">
    <div>
      <small id="mesa-chip" data-t="ejemplo">Ejemplo</small>
      <h1 class="nombre-rest">Su restaurante</h1>
      <button class="orbe-entrada" id="entrar" aria-label="Tocar el orbe para entrar a la carta"><canvas width="520" height="520"></canvas></button>
      <p class="toque" data-t="toque">Toque el orbe</p>
      <p data-t="sub">y vea la carta. Puede hablarle o pedir con botones.</p>
      <div class="idiomas" id="idiomas-entrada" aria-label="Idioma"></div>
      <div class="marca"><i></i>Apex Play</div><br>
      <button class="qr-boton" id="ver-qr" data-t="qr">Mostrar código QR</button>
    </div>
  </section>

  <!-- 2. Carta -->
  <section class="pantalla" id="p-carta" hidden>
    <div class="cabeza">
      <div class="fila-cabeza">
        <div><div class="mesa" id="mesa-cab" data-t="ejemplo">Ejemplo</div><div class="rest nombre-rest">Su restaurante</div></div>
        <div style="display:flex;gap:6px">
          <button class="chip on" id="sonido" aria-pressed="true" aria-label="Voz del orbe">🔊</button>
          <button class="chip" id="mesero" data-t="mesero">🙋 Mesero</button>
        </div>
      </div>
      <div class="orbe-zona">
        <div><button class="orbe-arriba" id="orbe-arriba" aria-label="Hablar con el orbe"><canvas width="200" height="200"></canvas></button>
          <div class="estado-orbe" id="estado"></div></div>
        <div class="globo" id="globo" aria-live="polite"><div data-t="momento">Un momento…</div></div>
      </div>
      <div class="idiomas" id="idiomas-carta" aria-label="Idioma"></div>
    </div>
    <div class="carta" id="carta"></div>
    <div class="barra">
      <button class="ver-pedido" id="ver-pedido" disabled><span><span data-t="ver">Ver pedido</span> <span class="cuantos" id="cuantos">0</span></span><span id="total-barra">$ 0</span></button>
    </div>
  </section>

  <!-- 3. Enviado -->
  <section class="pantalla enviado" id="p-enviado" hidden>
    <div class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div><h2 data-t="enviado">¡Pedido enviado a la caja!</h2><p class="sub" data-t="enviado_sub">Su mesero se lo trae en unos minutos.</p></div>
    <div class="recibo" id="recibo"></div>
    <div class="botones-fin">
      <button class="principal" id="otra-vez" data-t="mas">Pedir algo más</button>
    </div>
  </section>
</div>

<script>

const $ = (s) => document.querySelector(s);

/* ---------- Orbe (late con la voz real) ---------- */
function dibujarOrbe(cv, t, extra) {
  const g = cv.getContext("2d"), w = cv.width, c = w / 2, r = w * 0.27;
  const k = 1 + 0.035 * Math.sin(t * 1.8) + extra * 0.16;
  g.clearRect(0, 0, w, w);
  const halo = g.createRadialGradient(c, c, r * 0.7 * k, c, c, r * 1.85 * k);
  halo.addColorStop(0, `rgba(63,208,255,${0.3 + extra * 0.45})`); halo.addColorStop(0.5, `rgba(63,208,255,${0.07 + extra * 0.15})`); halo.addColorStop(1, "rgba(63,208,255,0)");
  g.fillStyle = halo; g.fillRect(0, 0, w, w);
  const giro = pensando() ? 2.6 : 0.9;
  const anillo = (inc, vel, a, gr) => { g.save(); g.translate(c, c); g.rotate(inc + t * vel); g.strokeStyle = `rgba(139,233,255,${a})`;
    g.lineWidth = w * gr; g.beginPath(); g.ellipse(0, 0, r * 1.32 * k, r * 0.3 * k, 0, 0, Math.PI * 2); g.stroke(); g.restore(); };
  anillo(-0.35, -giro * 0.7, 0.22, 0.008);
  const cuerpo = g.createRadialGradient(c - r * 0.35, c - r * 0.4, r * 0.05, c, c, r * k);
  cuerpo.addColorStop(0, "#f2fcff"); cuerpo.addColorStop(0.25, "#7fe2ff"); cuerpo.addColorStop(0.55, "#2a9fe0"); cuerpo.addColorStop(0.85, "#0b3d91"); cuerpo.addColorStop(1, "#061a3d");
  g.beginPath(); g.arc(c, c, r * k, 0, Math.PI * 2); g.fillStyle = cuerpo; g.fill();
  // brillo que gira sobre la superficie
  g.save(); g.beginPath(); g.arc(c, c, r * k, 0, Math.PI * 2); g.clip();
  const bx = c + Math.cos(t * giro) * r * 0.55, by = c + Math.sin(t * giro) * r * 0.18 - r * 0.1;
  const brillo = g.createRadialGradient(bx, by, 0, bx, by, r * 0.5); brillo.addColorStop(0, "rgba(255,255,255,.28)"); brillo.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = brillo; g.fillRect(0, 0, w, w); g.restore();
  const borde = g.createRadialGradient(c, c, r * 0.8 * k, c, c, r * k);
  borde.addColorStop(0, "rgba(139,233,255,0)"); borde.addColorStop(1, `rgba(139,233,255,${0.35 + extra * 0.4})`);
  g.beginPath(); g.arc(c, c, r * k, 0, Math.PI * 2); g.fillStyle = borde; g.fill();
  anillo(0.25, giro, 0.65 + extra * 0.3, 0.012);
}

  decir(t);
};
orbe.onpedido = (p) => {
  if (p.pedido_numero) { ultimoPedido = p; return enviado(p); }        // confirmado (por voz o por botón): sale el recibo
  pedido = {}; for (const x of p.platos || []) if (x.id) pedido[x.id] = (pedido[x.id] || 0) + x.cantidad;
  pintar(); if ($(".hoja")) abrirPedido(hojaOferta);
};
orbe.onsinmic = () => aviso(T().sin_mic);
orbe.onsinvoz = () => aviso(T().sin_voz);
orbe.onerror = (m) => aviso(/conversación activa/.test(m) ? "Esta mesa ya está en uso en otro celular. Escanee el QR de otra mesa." : m);

function aviso(t) { const a = document.createElement("div"); a.className = "aviso"; a.textContent = t; document.body.append(a); setTimeout(() => a.remove(), 4500); }
function decir(texto, botones) {
  const g = $("#globo"); g.innerHTML = ""; const p = document.createElement("div"); p.textContent = texto; g.append(p);
  if (botones) { const fila = document.createElement("div"); fila.className = "acciones-globo";
    botones.forEach(([etq, fn, clase]) => { const b = document.createElement("button"); b.textContent = etq; if (clase) b.className = clase; b.onclick = fn; fila.append(b); }); g.append(fila); }
  const d = document.createElement("div"); d.className = "dijo"; g.append(d);
}

/* ---------- Carta ---------- */
const PRECIO = (id) => menu.menu.find((p) => p.id === id)?.precio || 0;
function tarjeta(p) {
  const n = pedido[p.id] || 0;
  const precio = p.antes ? `<span class="precio"><s>${plata(p.antes)}</s>${plata(p.precio)}</span>` : `<span class="precio">${plata(p.precio)}</span>`;
  const ctrl = n ? `<div class="contador"><button data-menos="${p.id}" aria-label="−1">−</button><b>${n}</b><button class="mas" data-mas="${p.id}" aria-label="+1">+</button></div>`
                 : `<button class="pedir" data-mas="${p.id}">${T().pedir}</button>`;
  const foto = p.foto ? `<img src="${p.foto}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:16px">` : (DIBUJO[p.id] || PLATO_GENERICO);
  return `<article class="plato ${n ? "elegido" : ""}"><div class="foto">${foto}</div>
    <div class="info">${p.oferta ? `<span class="oferta-tag">${T().oferta_tag}</span>` : ""}<h3>${esc(p.nombre)}</h3><p>${esc(p.descripcion)}</p><div class="pie-plato">${precio}${ctrl}</div></div></article>`;
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function pintar() {
  let html = "", grupo = null;
  for (const p of menu.menu) { if ((p.grupo || "") !== grupo) { grupo = p.grupo || ""; if (grupo) html += `<div class="seccion-titulo">${esc(grupo)}</div>`; } html += tarjeta(p); }
  $("#carta").innerHTML = html;
  const cant = Object.values(pedido).reduce((a, b) => a + b, 0);
  $("#cuantos").textContent = cant; $("#total-barra").textContent = plata(total()); $("#ver-pedido").disabled = !cant;
}
const total = () => Object.entries(pedido).reduce((s, [id, n]) => s + PRECIO(id) * n, 0);
async function pedir(id) {
  pedido[id] = (pedido[id] || 0) + 1; pintar(); if ($(".hoja")) abrirPedido(hojaOferta);      // se ve al instante
  const r = await orbe.pedirPlato(id);
  if (r.sugerir) { const sug = menu.menu.find((p) => p.id === r.sugerir);
    decir(r.texto, [[T().si_agregar, () => pedir(r.sugerir)], [T().no_gracias, () => decir(T().listo_ver), "no"]]); }
}
async function quitar(id, todo) {
  const n = todo ? pedido[id] : 1; pedido[id] = Math.max(0, (pedido[id] || 0) - n); if (!pedido[id]) delete pedido[id];
  pintar(); if ($(".hoja")) abrirPedido(hojaOferta);
  await orbe.quitarPlato(id, n);
}
$("#carta").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.mas) pedir(b.dataset.mas); if (b.dataset.menos) quitar(b.dataset.menos); });

/* ---------- Ver pedido, quitar, confirmar (con la oferta del día) ---------- */
let hojaOferta = null;
function cerrarHoja() { $(".hoja")?.remove(); $(".velo")?.remove(); hojaOferta = null; }
function abrirPedido(oferta) {
  $(".hoja")?.remove(); $(".velo")?.remove(); hojaOferta = oferta || null;
  const velo = document.createElement("div"); velo.className = "velo"; velo.onclick = cerrarHoja;
  const hoja = document.createElement("div"); hoja.className = "hoja"; hoja.setAttribute("role", "dialog"); hoja.setAttribute("aria-label", T().su_pedido);
  const ids = Object.keys(pedido);
  let html = `<div class="agarre"></div><h2>${T().su_pedido}</h2><p class="sub">${MESA ? `${T().mesa} ${esc(MESA)} · ` : ""}${T().revise}</p><div class="lineas">`;
  html += ids.length ? ids.map((id) => { const p = menu.menu.find((x) => x.id === id), n = pedido[id];
    return `<div class="linea"><b>${esc(p?.nombre || id)}</b><div class="ctrl"><div class="contador"><button data-menos="${id}" aria-label="−1">−</button><b>${n}</b><button class="mas" data-mas="${id}" aria-label="+1">+</button></div>
      <button class="quitar" data-quitar="${id}">${T().quitar}</button></div><span class="sub-l">${plata(n * PRECIO(id))}</span></div>`; }).join("")
    : `<p class="vacio">${T().vacio}</p>`;
  html += `</div>`;
  if (ids.length) html += `<div class="total"><span>${T().total}</span><span>${plata(total())}</span></div>`;
  const of = oferta && menu.menu.find((p) => p.id === oferta);
  if (of && ids.length) html += `<div class="oferta"><div class="mini-orbe"><canvas width="140" height="140"></canvas></div>
      <div><p>${T().oferta(esc(of.nombre), of.antes ? plata(of.antes) : "", plata(of.precio))}</p>
      <div class="botones"><button class="si" id="oferta-si">${T().si_agregarlo}</button><button class="no" id="oferta-no">${T().no_enviar}</button></div></div></div>`;
  else if (ids.length) html += `<button class="confirmar" id="confirmar">${T().confirmar}</button>`;
  html += `<button class="seguir" id="seguir">${T().seguir}</button>`;
  hoja.innerHTML = html; document.body.append(velo, hoja);
  hoja.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.mas) pedir(b.dataset.mas); else if (b.dataset.menos) quitar(b.dataset.menos); else if (b.dataset.quitar) quitar(b.dataset.quitar, true); });
  $("#seguir").onclick = cerrarHoja;
  $("#confirmar") && ($("#confirmar").onclick = () => confirmar());
  $("#oferta-si") && ($("#oferta-si").onclick = () => confirmar(oferta));
  $("#oferta-no") && ($("#oferta-no").onclick = () => confirmar());
}
$("#ver-pedido").onclick = () => abrirPedido();
async function confirmar(agregar = "") {
  document.querySelectorAll(".hoja button").forEach((b) => b.disabled = true);
  const r = await orbe.confirmar(agregar);
  if (r.oferta) return abrirPedido(r.oferta);
  if (r.despedida) return enviado(r.pedido);
  document.querySelectorAll(".hoja button").forEach((b) => b.disabled = false);
}
function enviado(p) {
  cerrarHoja();
  if (!p || !p.pedido_numero) return;
  const hora = new Date().toLocaleTimeString(T().locale, { hour: "numeric", minute: "2-digit" });
  $("#recibo").innerHTML = `<h3><span>${T().pedido_n} #${p.pedido_numero}${MESA ? ` · ${T().mesa} ${esc(MESA)}` : ""}</span><span>${hora}</span></h3>` +
    p.platos.map((l) => `<div class="r-linea"><span>${l.cantidad} × ${esc(l.plato)}</span><span>${plata(l.cantidad * PRECIO(l.id))}</span></div>`).join("") +
    `<div class="r-total"><span>${T().total}</span><span>${plata(p.total_numero)}</span></div>`;
  pedido = {}; pintar(); mostrar("p-enviado");
}

/* ---------- Pantallas ---------- */
function mostrar(id) { document.querySelectorAll(".pantalla").forEach((s) => s.hidden = s.id !== id); scrollTo(0, 0); }
$("#entrar").onclick = () => { mostrar("p-carta"); orbe.iniciar(); };     // el toque abre audio y micrófono
$("#orbe-arriba").onclick = () => orbe.hablar();                       // toque y hable: escucha solo esa frase
$("#sonido").onclick = () => { orbe.silencio = !orbe.silencio; const on = !orbe.silencio;
  $("#sonido").textContent = on ? "🔊" : "🔇"; $("#sonido").setAttribute("aria-pressed", on); $("#sonido").classList.toggle("on", on); };
$("#mesero").onclick = async () => { await orbe.llamarMesero().catch((e) => aviso(e.message)); aviso(T().mesero_ok); };
$("#otra-vez").onclick = () => { mostrar("p-carta"); decir(T().que_mas); };
addEventListener("pagehide", () => orbe.terminar("salió de la página"));

async function cargarMenu() {
  try { menu = await (await fetch(`${API}/v1/menu/${encodeURIComponent(R)}?idioma=${IDIOMA}`)).json(); }
  catch { aviso(T().carga); return; }
  plata = (v) => new Intl.NumberFormat(T().locale, { style: "currency", currency: menu.moneda || "COP", maximumFractionDigits: 0 }).format(v);
  document.title = menu.nombre; document.querySelectorAll(".nombre-rest").forEach((e) => e.textContent = menu.nombre);
  pintar();
}
aplicarTextos(); cargarMenu();
</script>
